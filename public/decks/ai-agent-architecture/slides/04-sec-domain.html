<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>Раздел 01 · Домен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap">
<style>
:root { color-scheme: light; --c:#2E7FB8; --bg:#E1EEF7; }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; background:#ECEBE6; overflow:hidden; font-family:'Manrope', system-ui, sans-serif; color:#15140F; }
#stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:clamp(8px,1.4vw,22px); }
.no { font-size:clamp(110px,22vw,360px); font-weight:800; line-height:.9; letter-spacing:-.05em; color:var(--c); opacity:0; transform:translateY(24px); }
.t  { font-size:clamp(30px,5.2vw,86px); font-weight:800; letter-spacing:-.03em; line-height:1.04; opacity:0; transform:translateY(18px); }
.s  { font-size:clamp(13px,1.5vw,24px); font-weight:700; color:#8A8778; max-width:min(70vw,1100px); opacity:0; transform:translateY(14px); }
#tl { position:absolute; left:50%; transform:translateX(-50%); bottom:clamp(40px,8vh,90px); width:min(70vw,900px); }
#tl .bar { display:flex; gap:6px; }
#tl .seg { flex:1; }
#tl .seg b { display:block; height:clamp(8px,.9vw,14px); border-radius:7px; background:#D8D5CA; }
#tl .seg.on b { background:var(--c); }
#tl .seg span { display:block; margin-top:.7em; font-size:clamp(9px,.8vw,12px); font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#B7B4A8; }
#tl .seg.on span { color:var(--c); }
body.in .no, body.in .t, body.in .s { animation:up .6s cubic-bezier(.22,.8,.24,1) forwards; }
body.in .t { animation-delay:.12s; } body.in .s { animation-delay:.24s; }
@keyframes up { to { opacity:1; transform:none; } }
</style>
<div id="stage">
  <div class="no">01</div>
  <div class="t">Домен</div>
  <div class="s">Как устроен Customer Success: каналы, бот на первой линии, люди на второй</div>
</div>
<div id="tl"><div class="bar"><div class="seg on"><b></b><span>Домен</span></div><div class="seg"><b></b><span>Атаки</span></div><div class="seg"><b></b><span>Защита</span></div><div class="seg"><b></b><span>Архитектура</span></div><div class="seg"><b></b><span>Технологии</span></div></div></div>
<script>
// the entrance plays when the slide comes on and is reset once it is out of sight
function play() { if (document.body.classList.contains('in')) return; void document.body.offsetWidth; document.body.classList.add('in'); }
window.__enter = play;
window.__leave = function () { document.body.classList.remove('in'); };
var inDeck = false; try { inDeck = parent !== window && !!parent.show; } catch (e) {}
if (!inDeck) play();
</script>
<script>
addEventListener('keydown', function (e) {
  var d = {ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1}[e.key];
  if (!d || !parent.go) return;
  e.preventDefault();
  if (parent.__deckKey && parent.__deckKey(d)) return;   // a lead card in front takes the key
  var f = d > 0 ? window.__fwd : window.__back;
  if (f && f()) return;   // the slide took a step of its own
  parent.go(d);
});
</script>
