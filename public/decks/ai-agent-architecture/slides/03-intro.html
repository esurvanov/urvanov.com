// Always override: the native roundRect appends to the current path instead of
// starting one, so successive fills repaint every earlier subpath.
{
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    this.beginPath(); this.moveTo(x+r,y); this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r); this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r); this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r); this.lineTo(x,y+r);
    this.arcTo(x,y,x+r,y,r); this.closePath();
  };
}

    var me = { tx: holder.position.x, face: o.ry, nextT: T + 2 + Math.random() * 3, busyUntil: 0, walking: false, done: null };

    bone.updateMatrixWorld(true);
  }
  function solveLeg(l, t) {
    l.a.getWorldPosition(ikA); l.b.getWorldPosition(ikB); l.c.getWorldPosition(ikC);
    var lab = ikB.distanceTo(ikA), lbc = ikC.distanceTo(ikB);
    var lat = Math.min(Math.max(t.distanceTo(ikA), 0.01), lab + lbc - 0.001);
    var acab0 = new THREE.Vector3().subVectors(ikC, ikA).normalize().angleTo(new THREE.Vector3().subVectors(ikB, ikA).normalize());
    var babc0 = new THREE.Vector3().subVectors(ikA, ikB).normalize().angleTo(new THREE.Vector3().subVectors(ikC, ikB).normalize());
    var acab1 = Math.acos(Math.min(1, Math.max(-1, (lbc * lbc - lab * lab - lat * lat) / (-2 * lab * lat))));
    var babc1 = Math.acos(Math.min(1, Math.max(-1, (lat * lat - lab * lab - lbc * lbc) / (-2 * lab * lbc))));
    ikAx.crossVectors(ikT.subVectors(ikC, ikA), new THREE.Vector3().subVectors(ikB, ikA));
    if (ikAx.lengthSq() < 1e-10) return;
    ikAx.normalize();
    turnW(l.a, ikR.setFromAxisAngle(ikAx, acab1 - acab0));
    turnW(l.b, ikR.setFromAxisAngle(ikAx, babc1 - babc0));

    l.a.getWorldPosition(ikA); l.c.getWorldPosition(ikC);
    var from = ikC.sub(ikA).normalize(), to = ikT.subVectors(t, ikA).normalize();
    turnW(l.a, ikR.setFromUnitVectors(from, to));

  function feetUpdate() {
    var v = new THREE.Vector3(), w = new THREE.Vector3(), q = new THREE.Quaternion(), hq = new THREE.Quaternion();
    FEET.forEach(function (f) {
      var h = f.holder;
      if (!h.visible || !h.parent) return;
      // carried along: walking (the walker says how much) or moved by hand
      var carried = (h.userData.gait || 0) > 0.02 || h.position.distanceToSquared(f.last) > 1e-4; f.last.copy(h.position);
      // after a walk the clip needs a moment to bring the feet together before they settle
      // the lock takes hold a moment after the body comes to rest and lets go just
      // as gradually when it sets off, so the feet never snap between the two
      f.calm = carried ? 0 : f.calm + 1;
      f.k = Math.max(0, Math.min(1, (f.k || 0) + (f.calm > 20 ? 1 : -1) / 15));
      var k = f.k * f.k * (3 - 2 * f.k);
      h.updateMatrixWorld(true);
      h.getWorldQuaternion(hq);
      f.legs.forEach(function (l) {
        if (k <= 0) { l.anc = null; return; }
        v.copy(l.c.getWorldPosition(w)); h.worldToLocal(v);
        // standing figures keep their spot: a clip that shifts or lifts a foot does
        // not walk them away, the foot stays where it was put down after the last walk
        if (!l.anc) {
          l.anc = v.clone(); l.anc.y = Math.min(v.y, l.ground);
          l.c.getWorldQuaternion(q); l.ancQ = hq.clone().invert().multiply(q);
        }
        // a foot that has just been put down eases onto its spot
        solveLeg(l, h.localToWorld(w.copy(v).lerp(l.anc, k)));
        // the sole keeps the angle it was put down with
        l.c.parent.getWorldQuaternion(ikP);
        l.c.getWorldQuaternion(ikR);
        l.c.quaternion.copy(ikP.invert().multiply(ikR.slerp(q.copy(hq).multiply(l.ancQ), k)));
        l.c.updateMatrixWorld(true);
      });
    });
  }
  function frame(dt) {
    T += dt;
    var due = timers.filter(function (t) { return t.t <= T; });
    timers = timers.filter(function (t) { return t.t > T; });
    due.forEach(function (t) { t.fn(); });
    if (T > nextGreet && cast.length) { greetNext(); nextGreet = T + 1.4; }
    mixers.forEach(function (m) { m.update(dt); });
    people.forEach(function (p) { p.update(dt); });
    birds.forEach(function (b) {
      var k = ((T - b.t0) * b.speed) % 34;
      b.h.position.set(-17 + k, b.y + Math.sin((T - b.t0) * 1.3) * 0.25, b.z);
    });
    feetUpdate();
    camUser(dt);
    renderer.render(scene, camera);
  }
  (function tick() {
    requestAnimationFrame(tick);
    frame(Math.min(clock.getDelta(), 0.1));
  })();

  addEventListener('resize', function () {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  });
  });
});
</script>
<script>
addEventListener('keydown', function (e) {
  var d = {ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1}[e.key];
  if (!d || !parent.go) return;
  e.preventDefault();
  if (parent.__deckKey && parent.__deckKey(d)) return;   // a lead card in front takes the key
  var f = d > 0 ? window.__fwd : window.__back;
  if (f && f()) return;   // the slide took a step of its own
  parent.go(d);
});
