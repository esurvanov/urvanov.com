  };
  var X0 = -(5 * CW + 4 * CG) / 2 + CW / 2;
  function cardX(i) { return X0 + i * (CW + CG); }
  var cards = L.map(function (l, i) {
    var c = document.createElement('canvas'); c.width = 560; c.height = 320;
    var x = c.getContext('2d');
    var n = RISKS.filter(function (r) { return r[1] === i; }).length;

      });

    }
    function paint(active) {
      x.fillStyle = l.bg; x.fillRect(0, 0, 560, 320);
      x.fillStyle = l.css; x.roundRect(30, 30, 110, 110, 26); x.fill();
      x.fillStyle = '#FFFFFF'; x.font = '800 86px Manrope, sans-serif'; x.textAlign = 'center';
      x.fillText(l.k, 85, 116); x.textAlign = 'left';
      // count badge, top right
      x.font = '800 28px Manrope, sans-serif';
      var bw = x.measureText(cnt).width + 36;
      x.fillStyle = '#FFFFFF'; x.roundRect(530 - bw, 30, bw, 46, 23); x.fill();
      x.fillStyle = l.css; x.fillText(cnt, 548 - bw, 63);
      if (!active) {
        x.fillStyle = '#15140F'; x.font = '800 40px Manrope, sans-serif';
        wrap(l.ru, 500).forEach(function (t, j) { x.fillText(t, 30, 214 + j * 48); });
      } else {
        // the longest step decides the size, so all three fit the card
        var fs = 30;
        x.font = '700 30px Manrope, sans-serif';
        var wMax = Math.max.apply(null, l.steps.map(function (t) { return x.measureText(t).width; }));
        if (wMax > 456) fs = Math.floor(30 * 456 / wMax);
        x.font = '700 ' + fs + 'px Manrope, sans-serif';
        l.steps.forEach(function (t, j) {
          var y = 182 + j * 46;
          x.fillStyle = l.css; x.beginPath(); x.arc(46, y - 10, 15, 0, 6.3); x.fill();
          x.strokeStyle = '#FFFFFF'; x.lineWidth = 5; x.lineCap = 'round'; x.lineJoin = 'round';
          x.beginPath(); x.moveTo(39, y - 10); x.lineTo(44, y - 4); x.lineTo(54, y - 16); x.stroke();
          x.fillStyle = '#15140F'; x.fillText(t, 74, y);
        });
      }
    }
    paint(false);
    var g = new THREE.Group();
    g.add(slab(CW, CH, 0.7, 0.26, parseInt(l.bg.slice(1), 16)));
    var f = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), face(c));
    f.position.z = FZ(0.7); g.add(f);
    g.position.set(cardX(i), CY, 0.6); world.add(g);
    var gl = glow(CW + 2.0, CH + 2.0, parseInt(l.css.slice(1), 16));
    gl.position.set(cardX(i), CY, -0.2); world.add(gl);
    g.userData.i = i;
    var card = { g: g, glow: gl, lit: -99, on: false };
    card.set = function (v) { if (card.on === v) return; card.on = v; paint(v); f.material.map.needsUpdate = true; };
    return card;
  });

  /* ========== Облако рисков ========== */
  var CHH = 0.38;
  function chip(text, css, bg) {
    var c = document.createElement('canvas'), x = c.getContext('2d');
    x.font = '800 34px Manrope, sans-serif';
    c.width = Math.ceil(x.measureText(text).width + 56); c.height = 76;
    x = c.getContext('2d');
    var w = CHH * c.width / 76, g = new THREE.Group();
    var body = slab(w, CHH, 0.1, 0.17, 0xFFFFFF); g.add(body);
    var f = new THREE.Mesh(new THREE.PlaneGeometry(w, CHH), new THREE.MeshBasicMaterial({ map: liveTex(c) }));
    f.position.z = FZ(0.1); g.add(f);
    function paint(dot, ink, fill) {

      x.fillStyle = dot; x.beginPath(); x.arc(26, 38, 9, 0, 6.3); x.fill();
      x.fillStyle = ink; x.font = '800 34px Manrope, sans-serif'; x.fillText(text, 44, 50);

    g.userData.w = w; g.userData.paint = paint;
    world.add(g);
    return g;
  }
  // every risk already sits in a column over the layer that closes it
  var chips = RISKS.map(function (r) { return { text: r[0], layer: r[1], m: chip(r[0]) }; });
  (function () {
    var count = [0, 0, 0, 0, 0];
    chips.forEach(function (c) {
      var k = count[c.layer]++;
      c.home = [cardX(c.layer), CY + CH / 2 + 0.38 + k * 0.44, 0.9];
      c.m.position.set(c.home[0], c.home[1], c.home[2]); c.from = c.to = c.home; c.t0 = -9;
    });
  })();
  // three looks of a risk: at rest, its layer is on, another layer is on
  function look(c, v) {
    var l = L[c.layer];
    if (v === 'on') c.m.userData.paint(l.css, l.css, '#FFFFFF');
    else if (v === 'dim') c.m.userData.paint('#D5D3CB', '#B7B4A8', '#F4F3EF');
    else c.m.userData.paint(l.css, '#15140F', '#FFFFFF');
  }
  chips.forEach(function (c) { look(c, 'rest'); });

  /* ========== Подписи ========== */
  var capEl = document.getElementById('cap');
  // the bar holds the whole route, like the other slides: G → U → A → R → D;
  // each pill is clickable, the current one is outlined, the passed ones keep their colour
  var CAP = L.map(function (l) { return [l.k + ' · ' + l.en, l.css]; });
  capEl.innerHTML = CAP.map(function () { return '<span class="s"></span>'; }).join('<span class="a">→</span>');
  capEl.querySelectorAll('.s').forEach(function (e, i) {
    e.textContent = CAP[i][0]; e.style.setProperty('--c', CAP[i][1]);
    e.addEventListener('click', function () { pick(i); });
  });
  function capSet(i) { for (var k = 0; k < CAP.length; k++) capS(k, k < i ? 2 : k === i ? 1 : 0); }
  function capS(k, v) { var e = capEl.querySelectorAll('.s')[k]; if (!e) return; e.classList.toggle('on', v === 1); e.classList.toggle('done', v === 2); }

  /* ========== Ход ========== */
  var T = 0, timers = [], mode = -1;
  function later(sec, fn) { timers.push({ t: T + sec, fn: fn }); }
  function move(c, to, delay) { c.from = [c.m.position.x, c.m.position.y, c.m.position.z]; c.to = to; c.t0 = T + delay; }
  // a hop in place: the risk answers to its layer
  function hop(c, delay) { c.from = c.to = c.home; c.t0 = T + delay; c.hop = true; }
  // one layer lights up: its risks hop and take its colour, the rest fade back
  function play(i, keep, first) {
    if (!keep) timers = [];
    mode = i; if (!keep) capSet(i); else capS(i, 1);
    cards.forEach(function (c, k) { c.set(k === i); });
    chips.forEach(function (c) { if (c.layer === i) return; if (!keep || c.layer > i) look(c, 'dim'); });
    var mine = chips.filter(function (c) { return c.layer === i; });
    // a clicked risk goes first
    if (first) mine = [first].concat(mine.filter(function (c) { return c !== first; }));
    mine.forEach(function (c, k) {
      later(0.2 + k * 0.16, function () { look(c, 'on'); hop(c, 0); });
    });
    later(0.2 + mine.length * 0.16 + 0.5, function () { cards[i].lit = T; capS(i, 2); });
  }
  // the whole contour: every layer in turn, then all of them at once
  function all() {
    timers = []; capSet(-1);
    chips.forEach(function (c) { look(c, 'dim'); });
    L.forEach(function (l, i) { later(i * 2.2, function () { play(i, true); }); });
    later(5 * 2.2, function () {
      mode = -1; capSet(5);
      cards.forEach(function (c) { c.set(false); c.lit = T; });
      chips.forEach(function (c) { look(c, 'on'); });
    });
  }
  // a click on a risk shows the layer that closes it
  function pickRisk(c) { play(c.layer, false, c); step = c.layer + 1; }
  // driven by hand: 1–5 or a click shows a layer, 0 the whole contour,
  // Space / Enter steps through G → U → A → R → D, then starts over
  var step = 0;
  function pick(i) { play(i); step = i + 1; }
  // the deck's arrows walk G → U → A → R → D, then turn the slide straight away
  window.__fwd = function () { if (step < 5) { pick(step); return true; } return false; };
  window.__back = function () { if (step > 1 && step <= 5) { pick(step - 2); return true; } if (step === 6) { pick(4); return true; } return false; };
  addEventListener('keydown', function (e) {
    var i = '12345'.indexOf(e.key);
    if (i >= 0) pick(i);
    else if (e.key === '0') { all(); step = 6; }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pick(step < 5 ? step : 0); }
  });
  var ray = new THREE.Raycaster(), mp = new THREE.Vector2(), hov = -1;
  function cardAt(e) {
    var b = renderer.domElement.getBoundingClientRect();
    mp.set((e.clientX - b.left) / b.width * 2 - 1, -(e.clientY - b.top) / b.height * 2 + 1);
    ray.setFromCamera(mp, camera);
    var hit = ray.intersectObjects(cards.map(function (c) { return c.g; }), true)[0];
    var o = hit && hit.object; while (o && o.userData.i === undefined) o = o.parent;
    return o ? o.userData.i : -1;
  }
  function chipAt(e) {
    var b = renderer.domElement.getBoundingClientRect();
    mp.set((e.clientX - b.left) / b.width * 2 - 1, -(e.clientY - b.top) / b.height * 2 + 1);
    ray.setFromCamera(mp, camera);
    var hit = ray.intersectObjects(chips.map(function (c) { return c.m; }), true)[0];

  // hovering a risk shows what it means, next to the pointer
  var tipEl = document.getElementById('tip'), tipFor = null;
  function tip(c, e) {

      tipFor = c;
      var l = c.layer >= 0 ? L[c.layer] : null;
      tipEl.style.setProperty('--c', l ? l.css : '#8A8778');
      tipEl.innerHTML = '<b></b><span></span>';
      tipEl.querySelector('b').textContent = c.text + ' · ' + (l ? l.k + ' · ' + l.en : 'вне контура');
      tipEl.querySelector('span').textContent = WHAT[c.text] || '';
    }
    var w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var x = Math.min(innerWidth - w - 12, e.clientX + 16), y = e.clientY + 18;
    if (y + h > innerHeight - 12) y = e.clientY - h - 14;

  renderer.domElement.addEventListener('pointermove', function (e) {
    hov = cardAt(e);

    renderer.domElement.style.cursor = hov >= 0 || c ? 'pointer' : '';
  });
  renderer.domElement.addEventListener('pointerleave', function () { hov = -1; tip(null); });
  renderer.domElement.addEventListener('pointerdown', function (e) {
    var c = chipAt(e); if (c) { pickRisk(c); return; }
    var i = cardAt(e); if (i >= 0) pick(i);
  });
  window.__pick = pick; window.__all = all; window.__risk = function (n) { pickRisk(chips[n]); };
  // on its own: the full contour once, then layer by layer, round and round
  // opens on the bare cloud of risks; nothing moves until the speaker asks

  var clock = new THREE.Clock();
  function frame(dt) {
    T += dt;
    var due = timers.filter(function (t) { return t.t <= T; });
    timers = timers.filter(function (t) { return t.t > T; });
    due.forEach(function (t) { t.fn(); });

    // a hop toward the viewer and back: a parabola in time, constant pull back,
    // so a risk never runs into its neighbours in the column
    chips.forEach(function (c) {

      c.m.position.set(c.home[0], c.home[1], c.home[2] + 4 * 0.7 * k * (1 - k));
    });

    });
    camUser(dt);
    renderer.render(scene, camera);
  }
  (function tick() {
    requestAnimationFrame(tick);
    frame(Math.min(clock.getDelta(), 0.1));
  })();

  addEventListener('resize', function () {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;

  });
});

<script>
(function () {
  function init() {
    var cap = document.getElementById('cap'); if (!cap) return;
    function fit() { cap.classList.toggle('ovf', cap.scrollWidth > cap.clientWidth + 2); }
    function follow() {
      var c = cap.querySelector('.s.on') || [].slice.call(cap.querySelectorAll('.s.done')).pop();
      if (!c) { cap.scrollTo({ left: 0, behavior: 'smooth' }); return; }
      cap.scrollTo({ left: c.offsetLeft - (cap.clientWidth - c.offsetWidth) / 2, behavior: 'smooth' });
    }
    new MutationObserver(function () { fit(); follow(); }).observe(cap, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
    addEventListener('resize', function () { fit(); follow(); });
    fit();
  }
  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', init); else init();
})();
</script><script>
addEventListener('keydown', function (e) {
  var d = {ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1}[e.key];
  if (!d || !parent.go) return;
  e.preventDefault();
  if (parent.__deckKey && parent.__deckKey(d)) return;   // a lead card in front takes the key
  var f = d > 0 ? window.__fwd : window.__back;
  if (f && f()) return;   // the slide took a step of its own
  parent.go(d);
});
