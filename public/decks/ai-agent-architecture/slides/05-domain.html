<style>

<script src="../lib/three.min.js"></script>
<script src="../lib/GLTFLoader.js"></script>
<script>
// Always override: the native roundRect appends to the current path instead of
// starting one, so successive fills repaint every earlier subpath.
{
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    this.beginPath(); this.moveTo(x+r,y); this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r); this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r); this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r); this.lineTo(x,y+r);
    this.arcTo(x,y,x+r,y,r); this.closePath();
  };
}

window.addEventListener('DOMContentLoaded', function () {
  // Canvas text falls back to the system face if Manrope has not arrived yet
  var F = document.fonts;
  var ready = F ? Promise.all([
    F.load('800 74px Manrope'), F.load('700 36px Manrope'), F.load('700 24px Manrope')
  ]).catch(function () {}) : Promise.resolve();
  ready.then(function () {

  /* jaiora palette */
  var CANVAS_BG = 0xECEBE6, FLOOR = 0xE2E0D8;
  var GREEN = 0x2A6B38, OCHRE = 0xB06C10;
  var CARD = 0xFFFFFF, CARD_EDGE = 0xDAD8CF, INK = 0x15140F;

  var W = innerWidth, H = innerHeight;

  var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H);
  renderer.setClearColor(CANVAS_BG);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();

  // Raised, slightly off-axis camera: every slab shows a side and a top face
  var camera = new THREE.PerspectiveCamera(24, W / H, 2, 140);
  camera.position.set(0, 6.4, 29.6);
  camera.lookAt(0, 0.05, 0);
  // The viewer can look around: drag to turn the scene, right-drag (or Shift+drag)
  // to move it, the wheel to come closer, a double click to go back. The story's
  // own camera keeps working underneath; the viewer's turn rides on top of it.
  var CU = { yaw: 0, pitch: 0, zoom: 1, px: 0, py: 0, to: { yaw: 0, pitch: 0, zoom: 1, px: 0, py: 0 },
             look: new THREE.Vector3(), base: null, last: null };
  (function () {
    var lookAt0 = camera.lookAt.bind(camera);
    camera.lookAt = function (x, y, z) {
      if (x && x.isVector3) CU.look.copy(x); else CU.look.set(x, y, z);
      lookAt0(CU.look);
    };
    CU.lookAt0 = lookAt0;
    var el = renderer.domElement, drag = null;
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    el.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey, on: false }; });
    addEventListener('pointerup', function () { drag = null; });
    addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.on && Math.hypot(dx, dy) < 4) return;
      drag.on = true; drag.x = e.clientX; drag.y = e.clientY;
      if (drag.pan) { CU.to.px -= dx * 0.0016; CU.to.py += dy * 0.0016; }
      else {
        CU.to.yaw = Math.max(-0.9, Math.min(0.9, CU.to.yaw - dx * 0.004));
        CU.to.pitch = Math.max(-0.35, Math.min(0.5, CU.to.pitch + dy * 0.003));
      }
    });
    el.addEventListener('wheel', function (e) {
      e.preventDefault();
      CU.to.zoom = Math.max(0.45, Math.min(1.8, CU.to.zoom * Math.exp(e.deltaY * 0.0012)));
    }, { passive: false });
    el.addEventListener('dblclick', function () { CU.to = { yaw: 0, pitch: 0, zoom: 1, px: 0, py: 0 }; });
    window.__center = function () { CU.to = { yaw: 0, pitch: 0, zoom: 1, px: 0, py: 0 }; };
    // a visible button on the slide itself, top right
    (function () {
      var bt = document.createElement('button');
      bt.textContent = '⌖ Центр'; bt.title = 'Вернуть сцену в центр';
      bt.style.cssText = 'position:fixed;top:clamp(14px,2vw,26px);right:clamp(16px,3vw,44px);z-index:5;border:0;' +
        'background:#FFFFFF;color:#15140F;border-radius:999px;padding:.5em 1em;cursor:pointer;' +
        'font:800 clamp(11px,.9vw,14px)/1 Manrope,system-ui,sans-serif;box-shadow:0 2px 10px rgba(21,20,15,.12);';
      bt.addEventListener('click', function (e) { e.stopPropagation(); window.__center(); });
      bt.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      document.body.appendChild(bt);
    })();
  })();
  var cuV = new THREE.Vector3(), cuR = new THREE.Vector3(), cuU = new THREE.Vector3(), cuT = new THREE.Vector3(), cuQ = new THREE.Quaternion();
  function camUser(dt) {
    var p = camera.position;
    // the story moved the camera since the last frame: that is the new base
    if (!CU.last || !p.equals(CU.last)) CU.base = p.clone();
    var k = 1 - Math.exp(-(dt || 0.016) * 8);
    ['yaw', 'pitch', 'zoom', 'px', 'py'].forEach(function (n) { CU[n] += (CU.to[n] - CU[n]) * k; });
    var tgt = CU.look, rel = cuV.copy(CU.base).sub(tgt), dist = rel.length();
    rel.applyQuaternion(cuQ.setFromAxisAngle(cuU.set(0, 1, 0), CU.yaw));
    cuR.crossVectors(cuU.set(0, 1, 0), rel).normalize();
    rel.applyQuaternion(cuQ.setFromAxisAngle(cuR, -CU.pitch));
    rel.multiplyScalar(CU.zoom);
    cuU.crossVectors(rel, cuR).normalize();
    cuT.copy(tgt).addScaledVector(cuR, -CU.px * dist).addScaledVector(cuU, CU.py * dist);
    camera.position.copy(cuT).add(rel);
    CU.lookAt0(cuT);
    CU.last = camera.position.clone();
  }

  scene.add(new THREE.AmbientLight(0xFFFFFF, 0.78));
  var sky = new THREE.HemisphereLight(0xFFFFFF, 0xC9C7BD, 0.5); scene.add(sky);
  var key = new THREE.DirectionalLight(0xFFFFFF, 0.62);
  key.position.set(-5, 23, 9);
  key.castShadow = true;
  key.shadow.mapSize.width = 2048;
  key.shadow.mapSize.height = 2048;
  key.shadow.camera.left = -15; key.shadow.camera.right = 15;
  key.shadow.camera.top = 15;   key.shadow.camera.bottom = -15;
  key.shadow.camera.near = 2;   key.shadow.camera.far = 48;
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.05;
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xFFFFFF, 0.22);
  fill.position.set(9, 4, 8); scene.add(fill);

  function flat(hex) {
    var m = new THREE.MeshLambertMaterial({ color: hex });
    m.color.convertSRGBToLinear();
    return m;
  }
  function face(cv) {
    var t = new THREE.CanvasTexture(cv); t.anisotropy = 8;
    t.encoding = THREE.sRGBEncoding;
    return new THREE.MeshBasicMaterial({ map: t });
  }

  /* Rounded, bevelled slabs — the whole 3D read lives here */
  function roundedShape(w, h, r) {
    var s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y);
    s.lineTo(x + w - r, y);           s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r);       s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h);           s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r);               s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  // The bevel sticks out past `depth` on both ends, so a face laid at d/2 sinks
  // inside the slab and disappears. Everything printed on a slab uses FZ.
  var BEVEL = 0.035;
  function FZ(d) { return d / 2 + BEVEL + 0.015; }

  function slab(w, h, d, r, hex) {
    var g = new THREE.ExtrudeGeometry(roundedShape(w, h, r), {
      depth: d, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.035,
      bevelOffset: 0, bevelSegments: 2, curveSegments: 7
    });
    g.translate(0, 0, -d / 2);
    var m = new THREE.Mesh(g, flat(hex));
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  function shade(g) {
    g.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  }

  // Front-on: depth comes from the raised camera alone, so nothing leans
  var world = new THREE.Group();
  world.position.y = -0.55;   // room under the title for the one-line lead
  scene.add(world);

  /* ========== Пол ========== */
  var BASE = -4.35;
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 90),
    new THREE.ShadowMaterial({ opacity: 0.11 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = BASE;
  ground.receiveShadow = true;
  world.add(ground);

  function ease(k) { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); }
  function liveTex(c) {
    var t = new THREE.CanvasTexture(c); t.anisotropy = 8; t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function personIcon(x, cx, cy, r, col) {
    x.fillStyle = col;
    x.beginPath(); x.arc(cx, cy - r * 0.45, r * 0.42, 0, 6.3); x.fill();
    x.beginPath(); x.arc(cx, cy + r * 0.75, r * 0.78, Math.PI, 0); x.fill();
  }

  /* ========== 1. Пять входов ========== */

  var CH = [
    { id: 'web',  name: 'Сайт',     code: 'WEB', css: '#2A6B38',
      msgs: ['Не приходит код', 'Как оплатить?', 'Где мой чек?'] },
    { id: 'tg',   name: 'Telegram', code: 'TG',  css: '#3A86C8',
      msgs: ['Где мой заказ?', 'Как сменить тариф?', 'Не пришёл чек'] },
    { id: 'wa',   name: 'WhatsApp', code: 'WA',  css: '#128C7E',
      msgs: ['Статус заказа', 'Поменять адрес', 'Когда доставка?'] },
    { id: 'mail', name: 'Почта',    code: '@',   css: '#C9762E',
      msgs: ['Почему отменили заказ?', 'Нужны документы', 'Хочу возврат'] },
    { id: 'call', name: 'Телефон',  code: 'ТЕЛ', css: '#8A5FC0',
      msgs: ['Возврат за заказ', 'Не проходит оплата', 'Закрыть аккаунт'] }
  ];

  // Device screens are redrawn whenever a new message lands on them
  var SCW = 300, SCH = 620;
  function drawScreen(c, kind, msg, hot) {
    var x = c.getContext('2d'), Wd = c.width, Hd = c.height;
    x.clearRect(0, 0, Wd, Hd);
    x.save();

    function bubble(t, out, y, bg, glow) {
      x.font = '600 21px Manrope, sans-serif';
      var w = x.measureText(t).width + 32, bx = out ? Wd - w - 16 : 16;
      if (glow) { x.fillStyle = 'rgba(255,196,0,.55)'; x.roundRect(bx - 5, y - 5, w + 10, 56, 20); x.fill(); }
      x.fillStyle = bg; x.roundRect(bx, y, w, 46, 16); x.fill();
      x.fillStyle = '#15140F'; x.fillText(t, bx + 16, y + 30);
    }
    function status(fg) {
      x.fillStyle = fg; x.font = '700 18px Manrope, sans-serif';
      x.fillText('9:41', 30, 36); x.fillRect(Wd - 64, 24, 34, 14);
    }
    function chatHead(bg, sub) {
      x.fillStyle = bg; x.fillRect(0, 0, Wd, 124);
      status('#FFFFFF');
      x.fillStyle = 'rgba(255,255,255,.9)'; x.beginPath(); x.arc(52, 90, 20, 0, 6.3); x.fill();
      x.fillStyle = '#FFFFFF'; x.font = '800 22px Manrope, sans-serif'; x.fillText('Клиент', 84, 86);
      x.font = '600 16px Manrope, sans-serif'; x.globalAlpha = .8; x.fillText(sub, 84, 108); x.globalAlpha = 1;
    }
    function inputBar(bg, btn) {
      x.fillStyle = bg; x.fillRect(0, Hd - 78, Wd, 78);
      x.fillStyle = '#FFFFFF'; x.roundRect(16, Hd - 64, Wd - 86, 40, 20); x.fill();
      x.fillStyle = btn; x.beginPath(); x.arc(Wd - 38, Hd - 44, 21, 0, 6.3); x.fill();
    }

    if (kind === 'web') {
      // desktop browser: a shop page with the support widget open in the corner
      x.roundRect(0, 0, Wd, Hd, 18); x.clip();
      x.fillStyle = '#F4F3EF'; x.fillRect(0, 0, Wd, Hd);
      x.fillStyle = '#E4E2DA'; x.fillRect(0, 0, Wd, 54);
      ['#E5484D', '#F5B83D', '#30C25B'].forEach(function (cc, i) {
        x.fillStyle = cc; x.beginPath(); x.arc(26 + i * 24, 27, 8, 0, 6.3); x.fill();
      });
      x.fillStyle = '#FFFFFF'; x.roundRect(110, 13, Wd - 140, 28, 14); x.fill();
      x.fillStyle = '#15140F'; x.font = '800 30px Manrope, sans-serif'; x.fillText('Магазин', 30, 108);
      x.fillStyle = '#D6D4CC';
      x.roundRect(30, 128, 220, 14, 7); x.fill(); x.roundRect(30, 152, 160, 14, 7); x.fill();
      [0, 1].forEach(function (i) { x.fillStyle = '#E4E2DA'; x.roundRect(30 + i * 150, 190, 130, 110, 12); x.fill(); });
      // widget
      var px = Wd - 300, py = 150;
      x.fillStyle = 'rgba(0,0,0,.12)'; x.roundRect(px + 4, py + 8, 270, 200, 18); x.fill();
      x.fillStyle = '#FFFFFF'; x.roundRect(px, py, 270, 200, 18); x.fill();
      x.fillStyle = '#2A6B38'; x.roundRect(px, py, 270, 46, 18); x.fill(); x.fillRect(px, py + 24, 270, 22);
      x.fillStyle = '#FFFFFF'; x.font = '800 18px Manrope, sans-serif'; x.fillText('Поддержка', px + 16, py + 30);
      x.font = '600 17px Manrope, sans-serif';
      var w = Math.min(238, x.measureText(msg).width + 26);
      if (hot) { x.fillStyle = 'rgba(255,196,0,.55)'; x.roundRect(px + 10, py + 64, w + 12, 46, 16); x.fill(); }
      x.fillStyle = '#EFEEE9'; x.roundRect(px + 16, py + 70, w, 34, 14); x.fill();
      x.fillStyle = '#15140F'; x.fillText(msg, px + 29, py + 93);
      x.fillStyle = '#E6F2EA'; x.roundRect(px + 270 - 16 - 150, py + 118, 150, 34, 14); x.fill();
      x.fillStyle = '#2A6B38'; x.fillText('Бот печатает…', px + 270 - 16 - 140, py + 141);
      x.fillStyle = '#2A6B38'; x.beginPath(); x.arc(Wd - 34, Hd - 34, 22, 0, 6.3); x.fill();
      x.restore();
      return;
    }

    x.roundRect(0, 0, Wd, Hd, 44); x.clip();
    if (kind === 'tg' || kind === 'wa') {
      var tg = kind === 'tg';
      x.fillStyle = tg ? '#CFDDE8' : '#ECE5DD'; x.fillRect(0, 0, Wd, Hd);
      chatHead(tg ? '#3A86C8' : '#128C7E', hot ? 'печатает…' : 'в сети');
      bubble(tg ? 'Добрый день!' : 'Здравствуйте', false, 160, '#FFFFFF');
      bubble(tg ? 'Чем помочь?' : 'Слушаю вас', true, 222, tg ? '#E1F5CF' : '#D9FDD3');
      bubble(msg, false, 284, '#FFFFFF', hot);
      inputBar(tg ? '#F2F5F8' : '#F0EBE4', tg ? '#3A86C8' : '#128C7E');
    } else if (kind === 'mail') {
      x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, Wd, Hd);
      status('#15140F');
      x.fillStyle = '#15140F'; x.font = '800 32px Manrope, sans-serif'; x.fillText('Входящие', 22, 104);
      [[msg, '#C9762E'], ['Возврат', '#3A86C8'], ['Документы', '#1E9E55'], ['Договор', '#8A5FC0']]
        .forEach(function (m, i) {
          var y = 136 + i * 96;
          if (i === 0 && hot) { x.fillStyle = 'rgba(255,196,0,.35)'; x.fillRect(0, y, Wd, 84); }
          x.fillStyle = m[1]; x.beginPath(); x.arc(44, y + 36, 20, 0, 6.3); x.fill();
          x.fillStyle = '#15140F'; x.font = '800 20px Manrope, sans-serif'; x.fillText(m[0], 78, y + 30);
          x.fillStyle = '#D6D4CC'; x.roundRect(78, y + 46, 170, 10, 5); x.fill();
          if (i < 2) { x.fillStyle = '#2E7BEA'; x.beginPath(); x.arc(270, y + 26, 7, 0, 6.3); x.fill(); }
          x.fillStyle = '#ECEBE6'; x.fillRect(78, y + 82, Wd - 78, 2);
        });
    } else {
      var gr = x.createLinearGradient(0, 0, 0, Hd);
      gr.addColorStop(0, '#3B3550'); gr.addColorStop(1, '#16141E');
      x.fillStyle = gr; x.fillRect(0, 0, Wd, Hd);
      status('#FFFFFF');
      if (hot) {
        [92, 78].forEach(function (r, i) {
          x.strokeStyle = 'rgba(255,255,255,' + (0.18 + i * 0.14) + ')'; x.lineWidth = 6;
          x.beginPath(); x.arc(Wd / 2, 200, r, 0, 6.3); x.stroke();
        });
      }
      x.fillStyle = '#8A7FB0'; x.beginPath(); x.arc(Wd / 2, 200, 58, 0, 6.3); x.fill();
      personIcon(x, Wd / 2, 200, 36, '#FFFFFF');
      x.textAlign = 'center'; x.fillStyle = '#FFFFFF';
      x.font = '800 28px Manrope, sans-serif'; x.fillText('Клиент', Wd / 2, 310);
      x.globalAlpha = .7; x.font = '600 18px Manrope, sans-serif';
      x.fillText(hot ? 'входящий вызов' : 'на линии', Wd / 2, 340);
      x.globalAlpha = 1; x.textAlign = 'left';
      [[78, '#E5484D'], [Wd - 78, '#30C25B']].forEach(function (b) {
        x.fillStyle = b[1]; x.beginPath(); x.arc(b[0], Hd - 110, 34, 0, 6.3); x.fill();
        x.fillStyle = '#FFFFFF'; x.roundRect(b[0] - 16, Hd - 116, 32, 12, 6); x.fill();
      });
    }
    x.fillStyle = '#0B0C0D'; x.roundRect(Wd / 2 - 46, 16, 92, 28, 14); x.fill();
    x.fillStyle = kind === 'call' ? 'rgba(255,255,255,.7)' : 'rgba(0,0,0,.55)';
    x.roundRect(Wd / 2 - 56, Hd - 14, 112, 6, 3); x.fill();
    x.restore();
  }

  // A current smartphone (thin glass body, island, side keys) — or, for the
  // site, a browser window of the same height
  function makeDevice(d) {
    var web = d.id === 'web';
    var w = web ? 1.5 : 0.70, h = web ? 1.1 : 1.44;
    var g = new THREE.Group();
    g.add(slab(w, h, 0.07, web ? 0.07 : 0.12, web ? 0xD9D7CF : 0x1C1E21));
    var c = document.createElement('canvas');
    c.width = web ? 600 : SCW; c.height = web ? 430 : SCH;
    drawScreen(c, d.id, d.msgs[0], false);
    var tex = liveTex(c);
    var scr = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.03, h - 0.03),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    scr.position.z = FZ(0.07); g.add(scr);
    if (!web) {
      [[-1, 0.36, 0.16], [-1, 0.14, 0.16], [1, 0.24, 0.26]].forEach(function (k) {
        var b = new THREE.Mesh(new THREE.BoxGeometry(0.03, k[2], 0.05), flat(0x2B2E32));
        b.position.set(k[0] * (w / 2 + 0.045), k[1], 0); g.add(b);
      });
    }
    // unread badge, hidden until a message arrives
    var badge = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.05, 24), flat(0xE5484D));
    badge.rotation.x = Math.PI / 2;
    badge.position.set(w / 2 - 0.02, h / 2 - 0.02, 0.12);
