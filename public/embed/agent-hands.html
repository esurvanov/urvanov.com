<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D: кто работает</title>
<style>
:root{color-scheme:dark light;--bg:#0e0e0e;--fg:#e9e7df;--bd:#333}
html[data-theme=light]{--bg:#f4f2ec;--fg:#1c1c19;--bd:#d6d2c4}
html,body{margin:0;height:100%;background:transparent;color:var(--fg);font:14px/1.4 system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(40% 50% at 82% 25%,var(--glow,rgba(154,150,138,.25)),transparent 70%)}
canvas{display:block;width:100%;height:100%;position:relative;z-index:1;touch-action:auto}
.cap{display:none;position:absolute;z-index:2;left:12px;right:12px;bottom:10px;text-align:center;font-size:14px;font-weight:600;color:var(--fg);text-shadow:0 1px 6px var(--bg)}
.tabs{position:absolute;z-index:2;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:calc(100% - 64px);flex-wrap:wrap;justify-content:center}
button{font:inherit;font-size:13px;font-weight:600;padding:5px 14px;border-radius:999px;border:1.5px solid var(--c);background:rgba(20,20,18,.55);color:var(--c);cursor:pointer;display:flex;align-items:center;gap:6px}
button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
button:hover{filter:brightness(1.2)}
#m0{--c:#9a968a}#m1{--c:#8b9bff}
html[data-theme=light] #m0{--c:#6a675b}html[data-theme=light] #m1{--c:#2440ff}
.tabs span{align-self:center;color:var(--fg);opacity:.6;font-size:13px}
.rot{position:absolute;z-index:2;right:12px;top:12px;font-size:12px;color:var(--fg);opacity:.9;display:flex;align-items:center;gap:6px;pointer-events:none;transition:opacity .5s}
.rot svg{width:22px;height:22px}
html[data-theme=light] button{background:rgba(255,255,255,.7)}
html button.on,html[data-theme=light] button.on{background:var(--c);color:#fff;border-color:var(--c)}
html button.on::before,html[data-theme=light] button.on::before{background:#fff}
html[data-theme=dark] button.on{color:#14141a}
html[data-theme=dark] button.on::before{background:#14141a}
</style>
<div id="stage"></div>
<div class="cap" id="cap"></div>
<div class="rot" id="rot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg><span id="rt"></span></div>
<div class="tabs"><button id="m0" class="on"></button><span>→</span><button id="m1"></button></div>

<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const stage=document.getElementById('stage');
const EN=new URLSearchParams(location.search).get('lang')==='en'; const TX=EN?{was:'Agent loads you',now:'You load agents',rot:'drag to rotate',you:'you',agent:'agent',agents:'agents',goal:'goal',work:'work',yourwork:'your work',hurry:'Run it! Copy it! Find it!',go:'Do it!',capWas:'The agent loads you with work: you do it by hand',capNow:'You load the agents: you do not follow their lead or do it by hand'}:{was:'Агент заряжает вас',now:'Вы заряжаете агентов',rot:'тяните, чтобы повернуть',you:'вы',agent:'агент',agents:'агенты',goal:'цель',work:'работа',yourwork:'ваша работа',hurry:'Запусти! Скопируй! Найди!',go:'Сделайте!',capWas:'Агент заряжает работой вас: вы делаете руками',capNow:'Вы заряжаете агентов: не идёте у них на поводу и не делаете руками'};
document.documentElement.lang=EN?'en':'ru'; m0.textContent=TX.was; m1.textContent=TX.now; 
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement); renderer.domElement.style.touchAction='pan-y'; renderer.domElement.style.cursor='grab';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,.1,100);
camera.position.set(1.3,6.8,21.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.5,0); controls.enableDamping=true; controls.enableRotate=true; controls.rotateSpeed=.7; controls.enableZoom=false; controls.enablePan=false;
controls.minPolarAngle=.9; controls.maxPolarAngle=1.5; controls.minAzimuthAngle=-.9; controls.maxAzimuthAngle=.9;

// light
const hemi=new THREE.HemisphereLight(0x9aa1f7,0x3a2a22,.75); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0dd,2.4);
sun.position.set(6,11,8); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-12; sun.shadow.camera.right=12; sun.shadow.camera.top=10; sun.shadow.camera.bottom=-10; sun.shadow.bias=-.0004; sun.shadow.radius=5;
scene.add(sun);
const world=new THREE.Group(); world.position.set(1.7,0,1.5); scene.add(world); // всё содержимое сдвинуто к центру платформы
const rimBlue=new THREE.PointLight(0xdfe1ee,60,18); rimBlue.position.set(-7,3,4); scene.add(rimBlue);
const rimOrange=new THREE.PointLight(0xe8e2d4,60,18); rimOrange.position.set(8,4,-2); scene.add(rimOrange);
const THEMES={
 dark:{bg:'radial-gradient(60% 70% at 28% 38%,#4b55b8 0%,#2b336f 48%,#171a33 100%)',glow:'rgba(154,150,138,.3)',sky:0xc4caff,ground:0x7a6050,hemi:1.5,sun:3.4,exp:1.45,plat:0x44443d,ring:0x9aa1ff,rimB:140,rimO:140,pill:'rgba(30,30,27,.94)',bt:'#ffffff',bub:'#e08a63',dust:.5},
 light:{bg:'radial-gradient(60% 70% at 28% 38%,#ffffff 0%,#eceeff 50%,#d6daf7 100%)',glow:'rgba(154,150,138,.22)',sky:0xffffff,ground:0xd2c6aa,hemi:1.9,sun:2.6,exp:1.05,plat:0xeee8d8,ring:0x6a73e0,rimB:50,rimO:50,pill:'rgba(255,255,255,.96)',bt:'#2d2618',bub:'#b1502e',dust:.0}
};
let TH=THEMES.dark; let isDark=true;

const M=(c,r=.55,m=0,extra={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,...extra});
const mBlue=M(0x8e96f5,.38), mBlueD=M(0x6f78e0,.4), mSkin=M(0xe8a07e,.42), mWhite=M(0xf1ecdf,.6), mGold=M(0xd8b25a,.3,.5), mStone=M(0xa89d80,.78), mStoneL=M(0xc4baa0,.8), mDark=M(0x1a1410,.5);
const mAgent=M(0x6b7bff,.4), mAgentD=M(0x3f50e0,.5);
const mk=(geo,mat)=>{const m=new THREE.Mesh(geo,mat);m.castShadow=true;m.receiveShadow=true;return m};

// platform
const plat=new THREE.Mesh(new THREE.CylinderGeometry(10.5,10.8,.5,96),M(0x1d1d1a,.85)); plat.position.y=-.25; plat.receiveShadow=true; scene.add(plat);
const ring=new THREE.Mesh(new THREE.TorusGeometry(10.55,.04,12,128),new THREE.MeshBasicMaterial({color:0x8e96f5})); ring.rotation.x=Math.PI/2; ring.position.y=.02; scene.add(ring);

// label sprites
function label(text,color,w=512,h=128,fs=64,pill=true){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  x.font=`800 ${fs}px system-ui,sans-serif`; x.textAlign='center'; x.textBaseline='middle';
  if(pill){x.fillStyle=TH.pill;x.strokeStyle=color;x.lineWidth=6;const r=h/2-4;x.beginPath();x.roundRect(6,6,w-12,h-12,r);x.fill();x.stroke();}
  x.fillStyle=color; x.fillText(text,w/2,h/2+4);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
function sprite(text,color,sx,sy,fs,w){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:label(text,color,w,w?w/4:undefined,fs),transparent:true,depthWrite:false}));s.scale.set(sx,sy,1);return s}

// block
const block=mk(new RoundedBoxGeometry(4.4,2.6,3.2,8,.22),mStone); block.position.set(3.6,1.3,0); world.add(block);
const top=mk(new RoundedBoxGeometry(4.2,.16,3.0,4,.07),mStoneL); top.position.set(3.6,2.62,0); world.add(top);
// block seams
for(const y of [.85,1.75]){const s=new THREE.Mesh(new THREE.BoxGeometry(4.42,.03,3.22),M(0x5d5540,.9));s.position.set(3.6,y,0);world.add(s)}
const bt=new THREE.Mesh(new THREE.PlaneGeometry(3.7,.95),new THREE.MeshBasicMaterial({map:label(TX.yourwork,'#ffffff',512,128,74,false),transparent:true}));
bt.position.set(3.6,1.3,1.62); world.add(bt);

// pyramid goal
const pyr=mk(new THREE.ConeGeometry(2.2,2.9,4),M(0xa79c7f,.85)); pyr.rotation.y=Math.PI/4; pyr.position.set(-9.8,1.45,-1); world.add(pyr);

// characters (ready CC0 model: Quaternius "Cube Guy", 3122 tris, 342 KB)
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
const loader=new GLTFLoader(); const stripes=[];
const workers=[]; const mixers=[]; const workerModels=[]; let bossModel=null; let mode=0; let bossHat=null;
const WORK_COL=[0x6a675b,0x6a675b], BOSS_COL=[0x6a675b,0x6a675b]; let handBone=null; const ov=new THREE.Group(); ov.position.set(3.6,2.7,0); world.add(ov);
const handFallback=new THREE.Object3D(); handFallback.position.set(-1.15,1.55,.55); ov.add(handFallback); const bossProps=[]; let bossCube=null;
function tint(obj,hex){const tc=new THREE.Color(0xffffff).lerp(new THREE.Color(hex),.38);obj.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;m.material=m.material.clone();m.material.color.copy(tc);m.material.roughness=.55;m.material.metalness=0;}})}
function fit(obj,h){const k=h/2.84;obj.scale.setScalar(k);return k}
loader.load('/models/cube.glb',gltf=>{
  const clipBy=n=>gltf.animations.find(a=>a.name.endsWith(n));
  const faceDir=-1.07;
  [[-5.8,-1.6,0,0x6a675b],[-3.0,.2,.9,0x6a675b],[-.2,1.8,1.8,0x6a675b]].forEach(([x,z,ph,col])=>{
    const m=SkeletonUtils.clone(gltf.scene); const g=new THREE.Group(); g.add(m); fit(m,2.1); tint(m,col); workerModels.push(m);
    g.position.set(x,0,z); g.rotation.y=faceDir; world.add(g);
    const mx=new THREE.AnimationMixer(m); const act=mx.clipAction(clipBy('Walk_Hold')); act.timeScale=.85; act.time=ph; act.play(); mixers.push(mx);
    // sweat
    const drops=[]; for(let i=0;i<3;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.06,10,10),new THREE.MeshBasicMaterial({color:0xdff0ff,transparent:true,opacity:.9}));d.scale.y=1.4;g.add(d);drops.push(d)}
    // агент-квадрат: скруглённый куб с глазами и ножками
    const cube=new THREE.Group(); cube.visible=false; cube.rotation.y=.75; g.add(cube);
    const body=mk(new RoundedBoxGeometry(1.5,1.5,1.5,6,.2),mAgent); body.position.y=.95; cube.add(body);
    for(const x of [-.34,.34]){const e=mk(new THREE.SphereGeometry(.13,16,16),mDark); e.scale.set(1,1.35,.4); e.position.set(x,1.08,.76); cube.add(e); const hl=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),new THREE.MeshBasicMaterial({color:0xffffff})); hl.position.set(x-.03,1.14,.8); cube.add(hl)}
    const mouth=mk(new THREE.TorusGeometry(.2,.04,8,20,Math.PI),mDark); mouth.rotation.z=Math.PI; mouth.position.set(0,.7,.76); cube.add(mouth);
    const feet=[-.38,.38].map(x=>{const f=mk(new RoundedBoxGeometry(.5,.28,.6,3,.08),mAgentD); f.position.set(x,.14,.05); cube.add(f); return f});
    workers.push({g,drops,ph,human:m,cube,body,feet});
  });
  const m=SkeletonUtils.clone(gltf.scene); const k=fit(m,2.6); tint(m,0x6a675b); bossModel=m; ov.add(m); ov.rotation.y=faceDir;
  const mx=new THREE.AnimationMixer(m); const act=mx.clipAction(clipBy('Idle_Attack')); act.timeScale=.9; act.play(); mixers.push(mx);
  m.traverse(o=>{if(o.isBone&&/fist.*r$|fist\\.r|palm.*r|hand.*r/i.test(o.name)&&!handBone)handBone=o});
  // pharaoh headdress + collar + skirt as simple props
  const hat=mk(new THREE.CylinderGeometry(.34,.5,.62,28),mGold); hat.position.set(0,2.95,0); ov.add(hat);
  for(let i=0;i<5;i++){const a=(i-2)*.22;const st=new THREE.Mesh(new THREE.BoxGeometry(.04,.58,.03),M(0x4650c4,.5)); stripes.push(st);st.position.set(Math.sin(a)*.4,2.95,Math.cos(a)*.4);st.rotation.y=a;ov.add(st)}
  const sk=mk(new THREE.CylinderGeometry(.5,.62,.45,28),mWhite); sk.position.y=1.1; ov.add(sk);
  bossProps.push(sk,...stripes.filter(x=>x.parent===ov)); stripes.forEach(x=>x.position.y=2.5);
  // агент-погонщик: такой же квадрат, как агенты в «Стало», с золотым убором и рукой с хлыстом
  bossCube=new THREE.Group(); bossCube.rotation.y=.75; ov.add(bossCube);
  const bb=mk(new RoundedBoxGeometry(2,2,2,6,.25),mAgent); bb.position.y=1.15; bossCube.add(bb);
  for(const x of [-.45,.45]){const e=mk(new THREE.BoxGeometry(.2,.4,.06),mDark); e.position.set(x,1.35,1.01); bossCube.add(e)}
  const mo=mk(new THREE.BoxGeometry(.6,.09,.06),mDark); mo.position.set(0,.8,1.01); bossCube.add(mo)
  for(const x of [-.5,.5]){const f=mk(new RoundedBoxGeometry(.65,.3,.7,3,.08),mAgentD); f.position.set(x,.15,.05); bossCube.add(f)}
  const hand=mk(new THREE.SphereGeometry(.22,16,16),mAgentD); hand.position.copy(handFallback.position); ov.add(hand);
  bossProps.push(hand); hat.position.y=2.5; hat.userData.keep=true; bossHat=hat;
  applyMode(mode);
  console.log('bones:',handBone&&handBone.name);
});

// whip
const handWorld=new THREE.Vector3(); let whipMesh=null; let humanHand=null;
const whipAgent=M(0x3a2414,.6,0,{emissive:0x2a1a0c}), whipHuman=M(0xe2b862,.35,.3,{emissive:0x5a3a10});
function findHand(){ if(humanHand||!bossModel) return humanHand; bossModel.traverse(o=>{if(!humanHand&&o.isBone&&/^fist.?r$/i.test(o.name))humanHand=o}); return humanHand }
function updateWhip(t){
  const human=mode===1; const hb=human?findHand():null;
  if(human&&!hb){ if(whipMesh){scene.remove(whipMesh);whipMesh.geometry.dispose();whipMesh=null} return }
  (human?hb:handFallback).getWorldPosition(handWorld);
  const k=Math.sin(t*2.6); const crack=Math.max(0,Math.sin(t*2.6+1.2));
  const sc=human?.72:1;
  const p=[handWorld.clone(),
    handWorld.clone().add(new THREE.Vector3(-1.1*sc,1.2*sc+k*.25,.2)),
    handWorld.clone().add(new THREE.Vector3(-3.0*sc,.9*sc-crack*.5,.3)),
    handWorld.clone().add(new THREE.Vector3(-4.6*sc,-.2-crack*.4,.2)),
    handWorld.clone().add(new THREE.Vector3((-5.4+crack*.9)*sc,-.8-crack*.5,.15))];
  const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p),48,human?.04:.07,8,false);
  if(whipMesh){scene.remove(whipMesh);whipMesh.geometry.dispose()}
  whipMesh=mk(geo,human?whipHuman:whipAgent); scene.add(whipMesh);
}

// ropes
const ropeMat=M(0xc8a97a,.8);
const ropes=[];
[[-5.8,-1.6],[-3.0,.2],[-.2,1.8]].forEach(([wx,wz],i)=>{
  const a=new THREE.Vector3(wx-.2,1.3,wz+.1);
  const b=new THREE.Vector3(1.4,1.0+i*.35,wz);
  const mid=a.clone().lerp(b,.5); mid.y-=.08;
  const m=mk(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([a,mid,b]),32,.06,8,false),ropeMat); world.add(m);
});

// labels in 3D
let labelSprites=[]; let bubble=null;
function buildLabels(){
  labelSprites.forEach(l=>{world.remove(l);l.material.map.dispose();l.material.dispose()}); labelSprites=[];
  bubble=sprite(mode?TX.go:TX.hurry,mode?(isDark?'#9a968a':'#6a675b'):TH.bub,mode?4.6:5.8,mode?1.15:1.45,mode?60:46,mode?512:768); bubble.position.set(mode?5.4:4.8,7.0,0); world.add(bubble);
  const lb1=sprite(mode?TX.agents:TX.you,mode?(isDark?'#8b9bff':'#2440ff'):(isDark?'#9a968a':'#6a675b'),2.4,.6,70); lb1.position.set(-3,.6,3.6);
  const lb2=sprite(mode?TX.you:TX.agent,mode?(isDark?'#9a968a':'#6a675b'):(isDark?'#8b9bff':'#2440ff'),2.8,.7,70); lb2.position.set(3.6,.6,3.8);
  const lb3=sprite(TX.goal,isDark?'#cfc4a6':'#6e6650',2.6,.65,70); lb3.position.set(-9.8,.6,2.6);
  [lb1,lb2,lb3].forEach(l=>world.add(l)); labelSprites=[bubble,lb1,lb2,lb3];
}
function applyMode(m){
  mode=m; document.getElementById('m0').classList.toggle('on',!m); document.getElementById('m1').classList.toggle('on',!!m);
  workerModels.forEach(w=>tint(w,WORK_COL[m])); workers.forEach(w=>{w.human.visible=!m; w.cube.visible=!!m});
  if(bossModel){bossModel.visible=!!m; if(bossCube)bossCube.visible=!m; bossProps.forEach(o=>o.visible=!m&&o!==bossProps[0]); if(bossProps[0])bossProps[0].visible=false; if(bossHat)bossHat.visible=!m} if(bossModel)tint(bossModel,BOSS_COL[m]);
  stripes.forEach(x=>x.material.color.set(m?0xd8b25a:0x4650c4));
  document.getElementById('cap').textContent=m?TX.capNow:TX.capWas;
  applyTheme(isDark);
}
function applyTheme(d){
  isDark=d; TH=d?THEMES.dark:THEMES.light; document.documentElement.dataset.theme=d?'dark':'light';
  stage.style.background=TH.bg; stage.style.setProperty('--glow',TH.glow);
  hemi.color.setHex(TH.sky); hemi.groundColor.setHex(TH.ground); hemi.intensity=TH.hemi; sun.intensity=TH.sun; renderer.toneMappingExposure=TH.exp;
  plat.material.color.setHex(TH.plat); ring.material.color.setHex(TH.ring); rimBlue.intensity=TH.rimB; rimOrange.intensity=TH.rimO;
  if(typeof dust!=='undefined') dust.material.opacity=TH.dust;
  bt.material.map=label(mode?TX.work:TX.yourwork,TH.bt,512,128,74,false); bt.material.needsUpdate=true;
  buildLabels();
}
// dust particles
const pts=[];for(let i=0;i<60;i++)pts.push(new THREE.Vector3((Math.random()-.5)*20,Math.random()*7,(Math.random()-.5)*10));
const pg=new THREE.BufferGeometry().setFromPoints(pts); const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffffff,size:.06,transparent:true,opacity:.35})); scene.add(dust);

const siteDark=()=>{try{const t=parent.document.documentElement.dataset.theme;if(t)return t!=='light'}catch(e){}return !matchMedia('(prefers-color-scheme: light)').matches};
applyTheme(siteDark()); document.getElementById('cap').textContent=TX.capWas;
try{new MutationObserver(()=>{const d=siteDark();if(d!==isDark)applyTheme(d)}).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}

document.getElementById('m0').onclick=()=>applyMode(0);
document.getElementById('m1').onclick=()=>applyMode(1);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();const d=Math.max(26,13.2/(Math.tan(camera.fov*Math.PI/360)*camera.aspect));const v=new THREE.Vector3(.1,.3,1).normalize().multiplyScalar(d);camera.position.copy(controls.target).add(v)}
addEventListener('resize',resize); resize();

const clock=new THREE.Clock();
let visible=true; new IntersectionObserver(e=>{visible=e[0].isIntersecting}).observe(stage);
renderer.setAnimationLoop(()=>{
  if(!visible){clock.getDelta();return}
  const dt=clock.getDelta(), t=clock.elapsedTime;
  mixers.forEach(m=>m.update(dt));
  workers.forEach(w=>{const a=t*4+w.ph*3, sn=Math.sin(a); w.body.position.y=.95; w.body.rotation.x=.07+sn*.03; w.cube.position.z=sn*.12; w.feet.forEach((f,i)=>{const ph=Math.sin(a+i*Math.PI); f.position.z=.05+ph*.3; f.position.y=.14+Math.max(0,ph)*.1}); w.human.rotation.x=.07+Math.sin(t*2.2+w.ph)*.02});
  workers.forEach(w=>w.drops.forEach((d,i)=>{const f=((t*.7+i*.33+w.ph)%1);d.position.set(-.1-i*.12,1.9-f*1.1,(i-1)*.35);d.material.opacity=1-f}));
  updateWhip(t);
  controls.update(); renderer.render(scene,camera);
});
</script>
