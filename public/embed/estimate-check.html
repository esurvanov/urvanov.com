function interaction(f){ // f 0..1 внутри решения: вопрос летит к человеку, человек решает, ответ летит назад. В остальное время всё спокойно
  const on=f>=0; linkM.opacity=on?.7:0;
  if(wavePose!==on&&actWave&&actIdle){wavePose=on; if(on){actIdle.fadeOut(.2);actWave.reset().fadeIn(.2).play()}else{actWave.fadeOut(.2);actIdle.reset().fadeIn(.2).play()}}
  if(!on){msgLbl.el.style.opacity=0; return}
  let a,b,k,txt,col;
  if(f<.3){a=A_POS;b=H_POS;k=f/.3;txt=TX.q;col='agent'} else if(f<.7){a=H_POS;b=H_POS;k=0;txt=TX.deciding;col='you'} else {a=H_POS;b=A_POS;k=(f-.7)/.3;txt=TX.decided;col='real'}
  msgLbl.pos.lerpVectors(a,b,k); msgLbl.pos.y+=Math.sin(Math.PI*k)*.8+(f>=.3&&f<.7?.8:0);
  msgLbl.el.className='lbl bubble '+col; msgLbl.el.textContent=txt; msgLbl.el.style.opacity=1;
}

// ---------- состояние ----------
let t=0, playing=false, finished=false, ARR=[];
const T_=()=>mode().T;
function arrivals(){ // момент, когда кривая объёма достигла (i+1)/N; ни один куб не стартует раньше начала и не летит во время решений
  const T=T_(), D=FLY*T, out=[]; let j=0;
  for(let i=0;i<N;i++){ const tg=(i+1)/N*100-1e-6; while(j<1000&&prog(j/1000*T)<tg)j++; out.push(Math.max(j/1000*T,D)) }
  const ys=mode().ph.filter(p=>p[4]==='y');
  for(let i=0;i<N;i++){ for(const [y0,,,,] of []){} for(const p of ys){ if(out[i]-D<p[1]&&out[i]>p[0])out[i]=p[1]+D } if(i&&out[i]<out[i-1])out[i]=out[i-1] }
  return out;
}
function applyScene(tm){
  const T=T_(), D=FLY*T;
  cubes.forEach((c,i)=>{
    const u=Math.max(0,Math.min(1,(tm-(ARR[i]-D))/D)), r=routes[i].pts, l0=r[0].distanceTo(r[1]), l1=r[1].distanceTo(r[2]), d=u*(l0+l1);
    let a,b,k; if(d<l0){a=r[0];b=r[1];k=d/l0} else {a=r[1];b=r[2];k=(d-l0)/l1}
    c.position.lerpVectors(a,b,k); if(u>0&&u<1)c.position.y+=Math.sin(Math.PI*k)*1.0;
    c.material.color.lerpColors(neutral,c.userData.final,u>=1?1:d<l0?0:Math.min(1,(d-l0)/(l1*.15)));
  });
}
function setMode(k){
  play=k; FA=series(mode().ph,'a'); FX=series(mode().ph,'x'); TA=tokSeries('a'); TY=tokSeries('y'); BY=owners(); layoutTargets();
  cubes.forEach((c,i)=>{c.userData.final=BY[i]==='agent'?cAgent:cYou}); routes=BY.map((_,i)=>routeFor(i)); ARR=arrivals();
  t=0; playing=false; finished=false; buildGraph(); renderMeters(); refreshUI();
}

// ---------- график: стопка по объёму работы (0…100%) ----------
const gr=document.getElementById('gr');
const X0=68,X1=676,Y0=196,Y1=40,VBH=256;
let METRIC='time'; // по горизонтали: время или токены
// расход токенов: агент в работе тратит много, вы (руками и на решениях) почти ничего; итог режима = COST.tok
const RATE={a:1,x:.12,y:.08};
function tokF(){ const ph=mode().ph; let tot=0; for(const p of ph)tot+=RATE[p[4]]*(p[1]-p[0]); const k=COST[play].tok/tot;
  return t=>{let v=0; for(const p of ph){ const d=Math.max(0,Math.min(t,p[1])-p[0]); v+=RATE[p[4]]*d } return v*k } }
const MV=tm=>tm, MT=()=>T_();
// токены: накопленный расход агента и ваш против времени. Шкала одна на все режимы (до 100 тыс.), чтобы режимы сравнивались.
function tokSeries(who){ const ph=mode().ph; let tot=0; for(const p of ph)tot+=RATE[p[4]]*(p[1]-p[0]); const k=COST[play].tok/tot;
  return t=>{let v=0; for(const p of ph){ if((who==='a')!==(p[4]==='a'))continue; v+=RATE[p[4]]*(p[1]-p[0])*k*sm5((t-p[0])/(p[1]-p[0])) } return v} }
let TA=tokSeries('a'), TY=tokSeries('y');
const TT=t=>TA(t)+TY(t);
const fa=()=>METRIC==='time'?FA:TA, fp=()=>METRIC==='time'?prog:TT, fu=()=>METRIC==='time'?'%':' '+TX.k;
const metricUnit=()=>METRIC==='time'?TX.min:TX.k;
const fmtT=m=>m>60?(m/60).toString().replace('.',',')+' '+TX.h:m+' '+TX.min;
function buildGraph(){
  const T=T_(), px=tm=>X0+tm/T*(X1-X0), py=v=>Y0-v/100*(Y0-Y1), FA_=fa(), PR_=fp(); let s='';
  s+=`<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--agent)" stop-opacity=".65"/><stop offset="1" stop-color="var(--agent)" stop-opacity=".15"/></linearGradient><linearGradient id="gY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--you)" stop-opacity=".65"/><stop offset="1" stop-color="var(--you)" stop-opacity=".15"/></linearGradient></defs>`;
  for(const v of [0,50,100])s+=`<path d="M${X0} ${py(v)}H${X1}" stroke="currentColor" stroke-opacity=".16" stroke-dasharray="3 4"/><text x="${X0-8}" y="${py(v)+4}" text-anchor="end" font-size="11.5" fill="var(--muted)">${v}${fu()}</text>`;
  s+=`<path d="M${X0} ${Y1}V${Y0}H${X1}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
  {const step=T<=60?10:30; for(let tk=0;tk<=T;tk+=step)s+=`<path d="M${px(tk)} ${Y0}v4" stroke="var(--muted)"/><text x="${px(tk)}" y="${Y0+16}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${tk===0?'0':fmtT(tk)}</text>`}
  // будущее — тонкий контур, пройденное — заливка (areaA, areaY)
  const n=240, smp=Array.from({length:n+1},(_,i)=>i/n*T);
  const FA2=FA_, line=f=>smp.map((tm,i)=>(i?'L':'M')+px(tm).toFixed(1)+' '+py(f(tm)).toFixed(1)).join('');
  s+=`<path d="${line(FA_)}" fill="none" stroke="var(--agent)" stroke-opacity=".3" stroke-width="1.5"/><path d="${line(PR_)}" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>`;
  s+=`<path id="areaA" d="" fill="url(#gA)"/><path id="areaY" d="" fill="url(#gY)"/><path id="lineA" d="" fill="none" stroke="var(--agent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><g id="topSegs"></g><path id="cursor" d="" stroke="currentColor" stroke-opacity=".5" stroke-dasharray="4 4"/>`;
  // мейлстоуны на линии итога: решение — ромб, ручная работа — квадрат
  let nd=0,nh=0; for(const p of mode().ph){ if(p[4]==='a')continue; const x=px((p[0]+p[1])/2), d=p[4]==='y', y=py(PR_((p[0]+p[1])/2)), k=d?++nd:++nh;
    const col=d?'var(--hand)':'var(--you)'; s+=`<g class="ms" data-t="${p[0]}"><path d="M${x} ${y+(d?10:9)}V${Y0}" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 3" opacity=".8"/>`+(d?`<path d="M${x} ${y-10}l10 10-10 10-10-10z" fill="var(--hand)" stroke="var(--pillbg)" stroke-width="1.5"/>`:`<rect x="${x-9}" y="${y-9}" width="18" height="18" rx="4" fill="var(--you)" stroke="var(--pillbg)" stroke-width="1.5"/>`)+`<text x="${x}" y="${y+3.6}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${d?'var(--pillbg)':'#fff'}">${k}</text></g>`}
  // одна полоска «кто сейчас»
  const ly=Y0+26; s+=`<rect x="${X0}" y="${ly}" width="${X1-X0}" height="14" rx="3" fill="currentColor" fill-opacity=".07"/>`;
  for(const p of mode().ph) s+=`<rect class="seg" data-a="${p[0]}" data-b="${p[1]}" x="${px(p[0])}" y="${ly}" width="0" height="14" rx="3" fill="${p[4]==='a'?'var(--agent)':p[4]==='x'?'var(--you)':'var(--hand)'}"/>`;
  s+=`<text id="gNow" x="${X1}" y="16" text-anchor="end" font-size="12.5" font-weight="800" fill="currentColor" style="font-variant-numeric:tabular-nums"></text>`;
  gr.innerHTML=s;
  const sh=share(); document.getElementById('legend').innerHTML=`<span><i style="background:var(--agent)"></i>${TX.legAgent} <b>${sh.a}%</b></span><span><i style="background:var(--you)"></i>${TX.legYou} <b>${sh.x}%</b></span><span><i style="background:var(--hand);transform:rotate(45deg)"></i>${TX.legDec}</span><span><i style="background:var(--you);border-radius:2px"></i>${TX.legHand}</span>`;
  updateGraph();
}
function updateGraph(){
  const T=T_(), px=tm=>X0+tm/T*(X1-X0), py=v=>Y0-v/100*(Y0-Y1), FA_=fa(), PR_=fp(), nn=Math.max(2,Math.round(t/T*240));
  const ts=Array.from({length:nn+1},(_,i)=>i/nn*t), top=f=>ts.map((tm,i)=>(i?'L':'M')+px(tm).toFixed(1)+' '+py(f(tm)).toFixed(1)).join('');
  const bottomRev=f=>ts.slice().reverse().map(tm=>'L'+px(tm).toFixed(1)+' '+py(f(tm)).toFixed(1)).join('');
  const a=top(FA_), tot=top(PR_);
  gr.querySelector('#areaA').setAttribute('d',a+`L${px(t)} ${Y0}L${X0} ${Y0}Z`);
  gr.querySelector('#areaY').setAttribute('d',tot+bottomRev(FA_)+'Z');
  gr.querySelector('#lineA').setAttribute('d',a);
  // верхняя линия = агент + вы = итог 100%. Цвет участка — кто её сейчас поднимает; на решениях она плоская
  let segs=''; for(const p of mode().ph){ if(t<=p[0])break; const t1=Math.min(t,p[1]), m=Math.max(2,Math.round((t1-p[0])/T*240)); let d='';
    for(let i=0;i<=m;i++){const tm=p[0]+(t1-p[0])*i/m; d+=(i?'L':'M')+px(tm).toFixed(1)+' '+py(PR_(tm)).toFixed(1)}
    segs+=`<path d="${d}" fill="none" stroke="${p[4]==='a'?'var(--agent)':p[4]==='x'?'var(--you)':'var(--hand)'}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>` }
  gr.querySelector('#topSegs').innerHTML=segs;
  gr.querySelector('#cursor').setAttribute('d',`M${px(t)} ${Y1}V${Y0}`);
  gr.querySelectorAll('.ms').forEach(m=>m.style.opacity=t>=+m.dataset.t?1:.3);
  gr.querySelectorAll('.seg').forEach(r=>{const a0=+r.dataset.a,b0=+r.dataset.b,w=Math.max(0,Math.min(t,b0)-a0); r.setAttribute('width',w>0?Math.max(3,w/T*(X1-X0)):0)});
  gr.querySelector('#gNow').textContent=Math.round(t)+' '+TX.min+' · '+(METRIC==='time'?Math.round(prog(t))+'%':Math.round(TT(t))+' '+TX.k);
}
gr.addEventListener('pointerdown',e=>{scrub(e); gr.setPointerCapture(e.pointerId); gr._drag=true});
gr.addEventListener('pointermove',e=>{if(gr._drag)scrub(e)}); gr.addEventListener('pointerup',()=>gr._drag=false);
function scrub(e){const r=gr.getBoundingClientRect(), sc=Math.min(r.width/700,r.height/VBH), pad=Math.max(0,(r.width-700*sc)/2); const x=(e.clientX-r.left-pad)/sc; const target=Math.max(0,Math.min(1,(x-X0)/(X1-X0)))*MT();
  let lo=0,hi=T_(); for(let i=0;i<40;i++){const m=(lo+hi)/2; if(MV(m)<target)lo=m; else hi=m} t=(lo+hi)/2; playing=false; finished=false; refreshUI()}

// ---------- интерфейс ----------
function renderMeters(){ // переключатель шкалы графика: время или токены
  const c=COST[play], m=document.getElementById('meters');
  m.innerHTML=`<button id="mTime" class="plain" aria-pressed="${METRIC==='time'}">${TX.time}: ${c.time} ${TX.min}</button><button id="mTok" class="plain" aria-pressed="${METRIC==='tok'}">${TX.tokens}: ${c.tok} ${TX.k}</button>`;
  document.getElementById('mTime').onclick=()=>{METRIC='time'; buildGraph(); renderMeters()};
  document.getElementById('mTok').onclick=()=>{METRIC='tok'; buildGraph(); renderMeters()};
}
function refreshUI(){
  const T=T_(), ph=phaseAt(t);
  for(const [id,k] of [['pAgent','agent'],['pYou','you'],['pReal','real']])document.getElementById(id).setAttribute('aria-pressed',play===k);
  document.getElementById('play').textContent=playing?TX.pause:(finished||t>=T?TX.replay:TX.play);
  const sh=share(), nd=mode().ph.filter(p=>p[4]==='y').length;
  // реплика режима — только пока нет решения; сообщение — только во время решения
  const y=mode().ph.find(p=>p[4]==='y'&&t>=p[0]&&t<p[1]);
  cloudAgent.el.style.opacity=(!y&&play==='agent')?1:0; cloudYou.el.style.opacity=(!y&&play==='you')?1:0;
  factLbl.el.textContent=(EN?'Fact: agent ':'Факт: агент ')+sh.a+'% · '+(EN?'you ':'вы ')+sh.x+'% · '+(EN?'decisions ':'решений ')+nd; factLbl.el.style.opacity=(!y&&play==='real')?1:0;
  interaction(y?(t-y[0])/(y[1]-y[0]):-1);
  applyScene(t); updateGraph();
}
pAgent.onclick=()=>setMode('agent'); pYou.onclick=()=>setMode('you'); pReal.onclick=()=>setMode('real');
document.getElementById('play').onclick=()=>{ if(finished||t>=T_()){t=0;finished=false} playing=!playing; refreshUI() };
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); document.getElementById('play').click()}});
const HOLD_S=5.5, DUR=11; // секунд на каждую передачу решения и на всю ось

// ---------- рендер ----------
const tmp=new THREE.Vector3();
function resize(){const w=stage.clientWidth,h=Math.max(1,stage.clientHeight); renderer.setSize(w,h,false); camera.aspect=w/h; const z=Math.max(1,12.5/(Math.tan(camera.fov*Math.PI/360)*camera.aspect)/13.6); camera.position.set(0,7.4*z,13.6*z); camera.updateProjectionMatrix(); controls.update()}
new ResizeObserver(resize).observe(stage); resize();
function placeLabels(){const w=stage.clientWidth,h=stage.clientHeight; labels.forEach(l=>{tmp.copy(l.pos).applyMatrix4(world.matrixWorld).project(camera); l.el.style.left=((tmp.x+1)/2*w)+'px'; l.el.style.top=((1-tmp.y)/2*h)+'px'})}
const siteDark=()=>{try{const x=parent.document.documentElement.dataset.theme; if(x)return x!=='light'}catch(e){} return !matchMedia('(prefers-color-scheme: light)').matches};
function applyTheme(d){const T=d?THEMES.dark:THEMES.light; document.documentElement.dataset.theme=d?'dark':'light'; stage.style.background=T.bg; stage.style.setProperty('--glow',T.glow);
  hemi.color.setHex(T.sky); hemi.groundColor.setHex(T.ground); hemi.intensity=T.hemi; sun.intensity=T.sun; renderer.toneMappingExposure=T.exp; platMat.color.setHex(T.plat); ringMat.color.setHex(T.ring); rimBlue.intensity=T.rimB; rimOrange.intensity=T.rimO}
applyTheme(siteDark()); try{new MutationObserver(()=>applyTheme(siteDark())).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
setMode('real');

let visible=true; new IntersectionObserver(e=>{visible=e[0].isIntersecting}).observe(stage);
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!visible)return;
  mixers.forEach(m=>m.update(dt));
  if(playing){const T=T_(), yp=mode().ph.find(p=>p[4]==='y'&&t>=p[0]&&t<p[1]); t+=yp?dt*(yp[1]-yp[0])/HOLD_S:dt*T/DUR; if(t>=T){t=T; playing=false; finished=true} refreshUI()}
  controls.update(); world.updateMatrixWorld();
  renderer.render(scene,camera); placeLabels();
}
requestAnimationFrame(frame);
</script>
