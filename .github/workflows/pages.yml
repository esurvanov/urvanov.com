name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — полная история: prerender.mjs берёт честный lastmod для sitemap.xml из git log
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Игры живут в своём репозитории и подтягиваются при каждой выкладке
      # fetch-depth: 0 — тоже полная история: patch-games.mjs берёт из неё дату игр для sitemap.xml
      - uses: actions/checkout@v4
        with:
          repository: esurvanov/awesome-games
          path: games
          fetch-depth: 0
      - run: |
          for game in berezovka sibiria severny-razlom skhodka zhitie; do
            mkdir -p "dist/$game"
            rsync -a --exclude docs --exclude tests --exclude tools --exclude dev --exclude 'README*' "games/$game/" "dist/$game/"
          done
          # Хроники Королевств: только браузерная версия (web/ + assets/), без версии на Python и тестов
          mkdir -p dist/age-of-empires
          rsync -a --exclude tests --exclude tools --exclude PORTING.md --exclude demo.html --exclude demo.js \
            games/age-of-empires/web/ dist/age-of-empires/web/
          rsync -a games/age-of-empires/assets/ dist/age-of-empires/assets/
          cp games/age-of-empires/index.html games/age-of-empires/CREDITS.md dist/age-of-empires/
          # Эхо Разлома: только то, что грузит игра (без фото-референсов, заметок разработки, сервера и стенда);
          # игра — open-world.html, она же index.html (index.html репозитория — «Северный Разлом», он выложен отдельно)
          mkdir -p dist/ekho-razloma
          rsync -a --exclude docs --exclude tests --exclude tools --exclude references --exclude server \
            --exclude '*.md' --exclude '*.bak' --exclude '*-demo.html' --exclude '*.command' games/ekho-razloma/ dist/ekho-razloma/
          cp games/ekho-razloma/CREDITS.md dist/ekho-razloma/
          cp dist/ekho-razloma/open-world.html dist/ekho-razloma/index.html
      # Мастерская методов живёт в репозитории project-euler и тоже подтягивается при каждой выкладке
      - uses: actions/checkout@v4
        with:
          repository: esurvanov/project-euler
          path: project-euler
          fetch-depth: 0
      - run: |
          mkdir -p dist/methods-lab
          rsync -a project-euler/methods-lab/ dist/methods-lab/
      # Описание, разметка и счётчики для страниц игр и мастерской методов
      - run: node scripts/patch-games.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Сообщаем поисковикам об адресах из свежего sitemap.xml, чтобы робот пришёл сразу
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
        continue-on-error: true
