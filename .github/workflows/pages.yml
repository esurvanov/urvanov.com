name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA-фолбэк: Pages отдаёт 404.html на неизвестные пути
      - run: cp dist/index.html dist/404.html
      # Игры живут в своём репозитории и подтягиваются при каждой выкладке
      - uses: actions/checkout@v4
        with:
          repository: esurvanov/awesome-games
          path: games
      - run: |
          for game in berezovka sibiria; do
            mkdir -p "dist/$game"
            rsync -a --exclude docs --exclude tests --exclude 'README*' "games/$game/" "dist/$game/"
          done
          # Хроники Королевств: только браузерная версия (web/ + assets/), без версии на Python и тестов
          mkdir -p dist/age-of-empires
          rsync -a --exclude tests --exclude tools --exclude PORTING.md --exclude demo.html --exclude demo.js \
            games/age-of-empires/web/ dist/age-of-empires/web/
          rsync -a games/age-of-empires/assets/ dist/age-of-empires/assets/
          cp games/age-of-empires/index.html games/age-of-empires/CREDITS.md dist/age-of-empires/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
