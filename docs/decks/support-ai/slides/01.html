<script>
// Always override: the native roundRect appends to the current path instead of
// starting one, so successive fills repaint every earlier subpath.
{
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    this.beginPath(); this.moveTo(x+r,y); this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r); this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r); this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r); this.lineTo(x,y+r);
    this.arcTo(x,y,x+r,y,r); this.closePath();
  };
}

window.addEventListener('DOMContentLoaded', function () {
  // Canvas text falls back to the system face if Manrope has not arrived yet
  var F = document.fonts;
  var ready = F ? Promise.all([
    F.load('800 74px Manrope'), F.load('700 36px Manrope'), F.load('700 24px Manrope')
  ]).catch(function () {}) : Promise.resolve();
  ready.then(function () {

  /* jaiora palette */
  var CANVAS_BG = 0xECEBE6, FLOOR = 0xE2E0D8;
  var GREEN = 0x2A6B38, OCHRE = 0xB06C10;
  var CARD = 0xFFFFFF, CARD_EDGE = 0xDAD8CF, INK = 0x15140F;

  var W = innerWidth, H = innerHeight;

  var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H);
  renderer.setClearColor(CANVAS_BG);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();

  // Raised, slightly off-axis camera: every slab shows a side and a top face
  var camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 140);
  camera.position.set(0, 6.4, 29.6);
  camera.lookAt(0, 0.05, 0);

  scene.add(new THREE.AmbientLight(0xFFFFFF, 0.78));
  var sky = new THREE.HemisphereLight(0xFFFFFF, 0xC9C7BD, 0.5); scene.add(sky);
  var key = new THREE.DirectionalLight(0xFFFFFF, 0.62);
  key.position.set(-5, 23, 9);
  key.castShadow = true;
  key.shadow.mapSize.width = 2048;
  key.shadow.mapSize.height = 2048;
  key.shadow.camera.left = -15; key.shadow.camera.right = 15;
  key.shadow.camera.top = 15;   key.shadow.camera.bottom = -15;
  key.shadow.camera.near = 2;   key.shadow.camera.far = 48;
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.05;
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xFFFFFF, 0.22);
  fill.position.set(9, 4, 8); scene.add(fill);

  function flat(hex) {
    var m = new THREE.MeshLambertMaterial({ color: hex });
    m.color.convertSRGBToLinear();
    return m;
  }
  function face(cv) {
    var t = new THREE.CanvasTexture(cv); t.anisotropy = 8;
    t.encoding = THREE.sRGBEncoding;
    return new THREE.MeshBasicMaterial({ map: t });
  }

  /* Rounded, bevelled slabs — the whole 3D read lives here */
  function roundedShape(w, h, r) {
    var s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y);
    s.lineTo(x + w - r, y);           s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r);       s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h);           s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r);               s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  // The bevel sticks out past `depth` on both ends, so a face laid at d/2 sinks
  // inside the slab and disappears. Everything printed on a slab uses FZ.
  var BEVEL = 0.035;
  function FZ(d) { return d / 2 + BEVEL + 0.015; }

  function slab(w, h, d, r, hex) {
    var g = new THREE.ExtrudeGeometry(roundedShape(w, h, r), {
      depth: d, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.035,
      bevelOffset: 0, bevelSegments: 2, curveSegments: 7
    });
    g.translate(0, 0, -d / 2);
    var m = new THREE.Mesh(g, flat(hex));
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  function shade(g) {
    g.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  }

  // Front-on: depth comes from the raised camera alone, so nothing leans
  var world = new THREE.Group();
  scene.add(world);

  /* ========== Пол ========== */
  var BASE = -4.35;
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 90),
    new THREE.ShadowMaterial({ opacity: 0.11 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = BASE;
  ground.receiveShadow = true;
  world.add(ground);

  function ease(k) { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); }
  function liveTex(c) {
    var t = new THREE.CanvasTexture(c); t.anisotropy = 8; t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function personIcon(x, cx, cy, r, col) {
    x.fillStyle = col;
    x.beginPath(); x.arc(cx, cy - r * 0.45, r * 0.42, 0, 6.3); x.fill();
    x.beginPath(); x.arc(cx, cy + r * 0.75, r * 0.78, Math.PI, 0); x.fill();
  }

  /* ========== 1. Пять входов ========== */

  var CH = [
    { id: 'web',  name: 'Сайт',     code: 'WEB', css: '#2A6B38',
      msgs: ['Не приходит код', 'Как оплатить?', 'Где мой чек?'] },
    { id: 'tg',   name: 'Telegram', code: 'TG',  css: '#3A86C8',
      msgs: ['Где мой бонус?', 'Как сменить тариф?', 'Не вижу выплату'] },
    { id: 'wa',   name: 'WhatsApp', code: 'WA',  css: '#128C7E',
      msgs: ['Статус заказа', 'Поменять адрес', 'Когда доставка?'] },
    { id: 'mail', name: 'Почта',    code: '@',   css: '#C9762E',
      msgs: ['Почему блокировка?', 'Нужны документы', 'Верните деньги'] },
    { id: 'call', name: 'Телефон',  code: 'ТЕЛ', css: '#8A5FC0',
      msgs: ['Возврат депозита', 'Не проходит платёж', 'Закрыть счёт'] }
  ];

  // Device screens are redrawn whenever a new message lands on them
  var SCW = 300, SCH = 620;
  function drawScreen(c, kind, msg, hot) {
    var x = c.getContext('2d'), Wd = c.width, Hd = c.height;
    x.clearRect(0, 0, Wd, Hd);
    x.save();

    function bubble(t, out, y, bg, glow) {
      x.font = '600 21px Manrope, sans-serif';
      var w = x.measureText(t).width + 32, bx = out ? Wd - w - 16 : 16;
      if (glow) { x.fillStyle = 'rgba(255,196,0,.55)'; x.roundRect(bx - 5, y - 5, w + 10, 56, 20); x.fill(); }
      x.fillStyle = bg; x.roundRect(bx, y, w, 46, 16); x.fill();
      x.fillStyle = '#15140F'; x.fillText(t, bx + 16, y + 30);
    }
    function status(fg) {
      x.fillStyle = fg; x.font = '700 18px Manrope, sans-serif';
      x.fillText('9:41', 30, 36); x.fillRect(Wd - 64, 24, 34, 14);
    }
    function chatHead(bg, sub) {
      x.fillStyle = bg; x.fillRect(0, 0, Wd, 124);
      status('#FFFFFF');
      x.fillStyle = 'rgba(255,255,255,.9)'; x.beginPath(); x.arc(52, 90, 20, 0, 6.3); x.fill();
      x.fillStyle = '#FFFFFF'; x.font = '800 22px Manrope, sans-serif'; x.fillText('Клиент', 84, 86);
      x.font = '600 16px Manrope, sans-serif'; x.globalAlpha = .8; x.fillText(sub, 84, 108); x.globalAlpha = 1;
    }
    function inputBar(bg, btn) {
      x.fillStyle = bg; x.fillRect(0, Hd - 78, Wd, 78);
      x.fillStyle = '#FFFFFF'; x.roundRect(16, Hd - 64, Wd - 86, 40, 20); x.fill();
      x.fillStyle = btn; x.beginPath(); x.arc(Wd - 38, Hd - 44, 21, 0, 6.3); x.fill();
    }

    if (kind === 'web') {
      // desktop browser: a shop page with the support widget open in the corner
      x.roundRect(0, 0, Wd, Hd, 18); x.clip();
      x.fillStyle = '#F4F3EF'; x.fillRect(0, 0, Wd, Hd);
      x.fillStyle = '#E4E2DA'; x.fillRect(0, 0, Wd, 54);
      ['#E5484D', '#F5B83D', '#30C25B'].forEach(function (cc, i) {
        x.fillStyle = cc; x.beginPath(); x.arc(26 + i * 24, 27, 8, 0, 6.3); x.fill();
      });
      x.fillStyle = '#FFFFFF'; x.roundRect(110, 13, Wd - 140, 28, 14); x.fill();
      x.fillStyle = '#15140F'; x.font = '800 30px Manrope, sans-serif'; x.fillText('Магазин', 30, 108);
      x.fillStyle = '#D6D4CC';
      x.roundRect(30, 128, 220, 14, 7); x.fill(); x.roundRect(30, 152, 160, 14, 7); x.fill();
      [0, 1].forEach(function (i) { x.fillStyle = '#E4E2DA'; x.roundRect(30 + i * 150, 190, 130, 110, 12); x.fill(); });
      // widget
      var px = Wd - 300, py = 150;
      x.fillStyle = 'rgba(0,0,0,.12)'; x.roundRect(px + 4, py + 8, 270, 200, 18); x.fill();
      x.fillStyle = '#FFFFFF'; x.roundRect(px, py, 270, 200, 18); x.fill();
      x.fillStyle = '#2A6B38'; x.roundRect(px, py, 270, 46, 18); x.fill(); x.fillRect(px, py + 24, 270, 22);
      x.fillStyle = '#FFFFFF'; x.font = '800 18px Manrope, sans-serif'; x.fillText('Поддержка', px + 16, py + 30);
      x.font = '600 17px Manrope, sans-serif';
      var w = Math.min(238, x.measureText(msg).width + 26);
      if (hot) { x.fillStyle = 'rgba(255,196,0,.55)'; x.roundRect(px + 10, py + 64, w + 12, 46, 16); x.fill(); }
      x.fillStyle = '#EFEEE9'; x.roundRect(px + 16, py + 70, w, 34, 14); x.fill();
      x.fillStyle = '#15140F'; x.fillText(msg, px + 29, py + 93);
      x.fillStyle = '#E6F2EA'; x.roundRect(px + 270 - 16 - 150, py + 118, 150, 34, 14); x.fill();
      x.fillStyle = '#2A6B38'; x.fillText('Бот печатает…', px + 270 - 16 - 140, py + 141);
      x.fillStyle = '#2A6B38'; x.beginPath(); x.arc(Wd - 34, Hd - 34, 22, 0, 6.3); x.fill();
      x.restore();
      return;
    }

    x.roundRect(0, 0, Wd, Hd, 44); x.clip();
    if (kind === 'tg' || kind === 'wa') {
      var tg = kind === 'tg';
      x.fillStyle = tg ? '#CFDDE8' : '#ECE5DD'; x.fillRect(0, 0, Wd, Hd);
      chatHead(tg ? '#3A86C8' : '#128C7E', hot ? 'печатает…' : 'в сети');
      bubble(tg ? 'Добрый день!' : 'Здравствуйте', false, 160, '#FFFFFF');
      bubble(tg ? 'Чем помочь?' : 'Слушаю вас', true, 222, tg ? '#E1F5CF' : '#D9FDD3');
      bubble(msg, false, 284, '#FFFFFF', hot);
      inputBar(tg ? '#F2F5F8' : '#F0EBE4', tg ? '#3A86C8' : '#128C7E');
    } else if (kind === 'mail') {
      x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, Wd, Hd);
      status('#15140F');
      x.fillStyle = '#15140F'; x.font = '800 32px Manrope, sans-serif'; x.fillText('Входящие', 22, 104);
      [[msg, '#C9762E'], ['Возврат', '#3A86C8'], ['Документы', '#1E9E55'], ['Счёт', '#8A5FC0']]
        .forEach(function (m, i) {
          var y = 136 + i * 96;
          if (i === 0 && hot) { x.fillStyle = 'rgba(255,196,0,.35)'; x.fillRect(0, y, Wd, 84); }
          x.fillStyle = m[1]; x.beginPath(); x.arc(44, y + 36, 20, 0, 6.3); x.fill();
          x.fillStyle = '#15140F'; x.font = '800 20px Manrope, sans-serif'; x.fillText(m[0], 78, y + 30);
          x.fillStyle = '#D6D4CC'; x.roundRect(78, y + 46, 170, 10, 5); x.fill();
          if (i < 2) { x.fillStyle = '#2E7BEA'; x.beginPath(); x.arc(270, y + 26, 7, 0, 6.3); x.fill(); }
          x.fillStyle = '#ECEBE6'; x.fillRect(78, y + 82, Wd - 78, 2);
        });
    } else {
      var gr = x.createLinearGradient(0, 0, 0, Hd);
      gr.addColorStop(0, '#3B3550'); gr.addColorStop(1, '#16141E');
      x.fillStyle = gr; x.fillRect(0, 0, Wd, Hd);
      status('#FFFFFF');
      if (hot) {
        [92, 78].forEach(function (r, i) {
          x.strokeStyle = 'rgba(255,255,255,' + (0.18 + i * 0.14) + ')'; x.lineWidth = 6;
          x.beginPath(); x.arc(Wd / 2, 200, r, 0, 6.3); x.stroke();
        });
      }
      x.fillStyle = '#8A7FB0'; x.beginPath(); x.arc(Wd / 2, 200, 58, 0, 6.3); x.fill();
      personIcon(x, Wd / 2, 200, 36, '#FFFFFF');
      x.textAlign = 'center'; x.fillStyle = '#FFFFFF';
      x.font = '800 28px Manrope, sans-serif'; x.fillText('Клиент', Wd / 2, 310);
      x.globalAlpha = .7; x.font = '600 18px Manrope, sans-serif';
      x.fillText(hot ? 'входящий вызов' : 'на линии', Wd / 2, 340);
      x.globalAlpha = 1; x.textAlign = 'left';
      [[78, '#E5484D'], [Wd - 78, '#30C25B']].forEach(function (b) {
        x.fillStyle = b[1]; x.beginPath(); x.arc(b[0], Hd - 110, 34, 0, 6.3); x.fill();
        x.fillStyle = '#FFFFFF'; x.roundRect(b[0] - 16, Hd - 116, 32, 12, 6); x.fill();
      });
    }
    x.fillStyle = '#0B0C0D'; x.roundRect(Wd / 2 - 46, 16, 92, 28, 14); x.fill();
    x.fillStyle = kind === 'call' ? 'rgba(255,255,255,.7)' : 'rgba(0,0,0,.55)';
    x.roundRect(Wd / 2 - 56, Hd - 14, 112, 6, 3); x.fill();
    x.restore();
  }

  // A current smartphone (thin glass body, island, side keys) — or, for the
  // site, a browser window of the same height
  function makeDevice(d) {
    var web = d.id === 'web';
    var w = web ? 1.5 : 0.70, h = web ? 1.1 : 1.44;
    var g = new THREE.Group();
    g.add(slab(w, h, 0.07, web ? 0.07 : 0.12, web ? 0xD9D7CF : 0x1C1E21));
    var c = document.createElement('canvas');
    c.width = web ? 600 : SCW; c.height = web ? 430 : SCH;
    drawScreen(c, d.id, d.msgs[0], false);
    var tex = liveTex(c);
    var scr = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.03, h - 0.03),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    scr.position.z = FZ(0.07); g.add(scr);
    if (!web) {
      [[-1, 0.36, 0.16], [-1, 0.14, 0.16], [1, 0.24, 0.26]].forEach(function (k) {
        var b = new THREE.Mesh(new THREE.BoxGeometry(0.03, k[2], 0.05), flat(0x2B2E32));
        b.position.set(k[0] * (w / 2 + 0.045), k[1], 0); g.add(b);
      });
    }
    // unread badge, hidden until a message arrives
    var badge = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.05, 24), flat(0xE5484D));
    badge.rotation.x = Math.PI / 2;
    badge.position.set(w / 2 - 0.02, h / 2 - 0.02, 0.12);
    badge.scale.setScalar(0.001); g.add(badge);
    shade(g);
    d.w = w; d.h = h; d.cv = c; d.tex = tex; d.badge = badge; d.dev = g;
    return g;
  }

  function makeTag(name, css) {
    var c = document.createElement('canvas'), x = c.getContext('2d');
    x.font = '800 36px Manrope, sans-serif';
    c.width = Math.ceil(x.measureText(name).width + 86); c.height = 84;
    x = c.getContext('2d');
    x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, 84);
    x.fillStyle = css; x.beginPath(); x.arc(34, 42, 11, 0, 6.3); x.fill();
    x.fillStyle = '#15140F'; x.font = '800 36px Manrope, sans-serif';
    x.fillText(name, 56, 55);
    var w = 0.37 * c.width / 84;
    var g = new THREE.Group();
    g.add(slab(w, 0.37, 0.1, 0.17, CARD));
    var f = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.37), face(c));
    f.position.z = FZ(0.1); g.add(f);
    g.userData.w = w;
    return g;
  }

  // Lay the five channels out as one evenly spaced row over the queue
  var PY = 4.0, GAP = 0.36, TGAP = 0.12;
  var tags = CH.map(function (d) { return makeTag(d.name, d.css); });
  CH.forEach(makeDevice);
  var rowW = 0;
  CH.forEach(function (d, i) { d.gw = d.w + TGAP + tags[i].userData.w; rowW += d.gw; });
  rowW += GAP * (CH.length - 1);
  var cx = -rowW / 2;
  CH.forEach(function (d, i) {
    d.x = cx + d.w / 2;
    d.y0 = PY + (1.44 - d.h) / 2;
    d.dev.position.set(d.x, d.y0, 0.6);
    d.dev.userData.ch = d;
    world.add(d.dev);
    tags[i].position.set(cx + d.w + TGAP + tags[i].userData.w / 2, PY + 0.4, 0.6);
    world.add(tags[i]);
    cx += d.gw + GAP;
  });

  /* ========== 2. Продукт: одно окно ========== */

  var SW = 11.6, SH = 3.5, SY = 0.45;
  var CW = Math.round(494 * SW / SH), RH = 80;

  var bezel = slab(SW + 0.5, SH + 0.5, 0.9, 0.3, CARD);
  bezel.position.set(0, SY, 0); world.add(bezel);

  var sc = document.createElement('canvas'); sc.width = CW; sc.height = 494;
  var s = sc.getContext('2d');
  var qTex = liveTex(sc);

  var CODE = {}; CH.forEach(function (d) { CODE[d.id] = d; });
  var QROWS = [
    { ch: 'tg',   text: 'Где мой бонус?', st: 'ok',  sec: 3, t0: -9, tf: -9 },
    { ch: 'call', text: 'Возврат депозита',   st: 'esc', sec: 0, t0: -9, tf: -9 },
    { ch: 'wa',   text: 'Статус заказа',      st: 'ok',  sec: 6, t0: -9, tf: -9 },
    { ch: 'mail', text: 'Почему блокировка?', st: 'hum', sec: 0, t0: -9, tf: -9 },
    { ch: 'web',  text: 'Не приходит код',    st: 'ok',  sec: 4, t0: -9, tf: -9 }
  ];

  function drawQueue(T) {
    s.fillStyle = '#FFFFFF'; s.fillRect(0, 0, CW, 494);

    var top = QROWS[0], slide = 1 - ease((T - top.t0) / 0.45);
    for (var i = 0; i < QROWS.length && i < 6; i++) {
      var r = QROWS[i], d = CODE[r.ch];
      var y = 92 + i * RH - slide * RH;
      s.globalAlpha = i === 0 ? ease((T - r.t0) / 0.45) : 1;
      s.fillStyle = i % 2 ? '#F7F6F2' : '#FFFFFF'; s.fillRect(0, y, CW, 72);
      var fl = 1 - Math.min(1, (T - r.tf) / 0.9);
      if (fl > 0) {
        s.globalAlpha = fl * 0.6;
        s.fillStyle = r.st === 'ok' ? '#CFE8D6' : '#F5DDBE'; s.fillRect(0, y, CW, 72);
        s.globalAlpha = 1;
      }
      s.fillStyle = '#E2E0D8'; s.fillRect(34, y + 71, CW - 68, 1.5);
      s.fillStyle = '#2A6B38'; s.roundRect(34, y + 14, 5, 44, 2.5); s.fill();

      s.fillStyle = d.css; s.roundRect(58, y + 17, 76, 38, 9); s.fill();
      s.fillStyle = '#FFFFFF'; s.font = 'bold 22px Manrope, sans-serif';
      s.textAlign = 'center'; s.fillText(d.code, 96, y + 44); s.textAlign = 'left';

      s.fillStyle = '#15140F'; s.font = 'bold 36px Manrope, sans-serif';
      s.fillText('«' + r.text + '»', 158, y + 48);

      var lbl, bg, fg;
      if (r.st === 'new') {
        lbl = 'бот отвечает' + '...'.slice(0, 1 + Math.floor(T * 3) % 3);
        bg = '#EFEEE9'; fg = '#6A675B';
      } else if (r.st === 'ok') { lbl = '✓  бот закрыл'; bg = '#E6F2EA'; fg = '#2A6B38'; }
      else if (r.st === 'hum') { lbl = '✓  человек закрыл'; bg = '#F7EADA'; fg = '#A8650F'; }
      else { lbl = 'эскалация'; bg = '#F7EADA'; fg = '#A8650F'; }
      s.font = 'bold 28px Manrope, sans-serif';
      var pad = r.st === 'esc' ? 70 : 46;
      var w = (r.st === 'new' ? s.measureText('бот отвечает...').width : s.measureText(lbl).width) + pad;
      var bx = CW - 190 - w;
      s.fillStyle = bg; s.roundRect(bx, y + 17, w, 38, 19); s.fill();
      s.fillStyle = fg;
      if (r.st === 'esc') { personIcon(s, bx + 32, y + 34, 13, fg); s.fillStyle = fg; s.fillText(lbl, bx + 52, y + 45); }
      else s.fillText(lbl, bx + 23, y + 45);

      s.fillStyle = '#8A8778'; s.font = 'bold 24px Manrope, sans-serif';
      s.textAlign = 'right';
      s.fillText(r.st === 'ok' ? r.sec + ' с' : r.st === 'esc' || r.st === 'hum' ? '2-я линия' : '', CW - 34, y + 45);
      s.textAlign = 'left';
      s.globalAlpha = 1;
    }

    // title bar on top, so sliding rows pass under it
    s.fillStyle = '#E6F2EA'; s.fillRect(0, 0, CW, 78);
    s.fillStyle = '#2A6B38'; s.font = 'bold 34px Manrope, sans-serif';
    s.fillText('ОЧЕРЕДЬ ПОДДЕРЖКИ', 34, 51);
    var tw = s.measureText('ОЧЕРЕДЬ ПОДДЕРЖКИ').width;
    s.fillStyle = '#6E7A66'; s.font = 'bold 26px Manrope, sans-serif';
    s.fillText('все каналы · одно окно', 34 + tw + 28, 51);
    s.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(T * 2));
    s.fillStyle = '#2A6B38'; s.beginPath(); s.arc(CW - 40, 38, 9, 0, 6.3); s.fill();
    s.globalAlpha = 1;
    s.fillStyle = '#6E7A66'; s.font = 'bold 24px Manrope, sans-serif';
    s.fillText('live', CW - 102, 47);
    qTex.needsUpdate = true;
  }
  drawQueue(0);

  var screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ map: qTex }));
  screenMesh.position.set(0, SY, FZ(0.9));
  world.add(screenMesh);

  /* ========== 3. Две линии ========== */

  // Every request lands on the first line (bot); what it cannot close is
  // escalated sideways to the second line (human)
  var PX = 3.9, PYB = -3.05, PNH = 1.6;
  function makePanel(ok, eyebrow, big, label, chip, css) {
    var cv = document.createElement('canvas'); cv.width = 560; cv.height = 172;
    var x = cv.getContext('2d');
    x.fillStyle = css.bg; x.fillRect(0, 0, 560, 172);
    x.fillStyle = css.fg; x.roundRect(22, 22, 6, 128, 3); x.fill();
    // eyebrow: line number as a solid disc, then the role
    x.beginPath(); x.arc(62, 40, 17, 0, 6.3); x.fill();
    x.fillStyle = '#FFFFFF'; x.font = '800 22px Manrope, sans-serif';
    x.textAlign = 'center'; x.fillText(ok ? '1' : '2', 62, 48); x.textAlign = 'left';
    x.fillStyle = css.fg; x.font = '800 22px Manrope, sans-serif';
    if (x.letterSpacing !== undefined) x.letterSpacing = '2px';
    x.fillText(eyebrow, 90, 48);
    if (x.letterSpacing !== undefined) x.letterSpacing = '0px';
    // icon: a tick for the bot, a person for the operator
    if (ok) {
      x.strokeStyle = css.fg; x.lineWidth = 11; x.lineCap = 'round'; x.lineJoin = 'round';
      x.beginPath(); x.moveTo(52, 112); x.lineTo(70, 132); x.lineTo(102, 88); x.stroke();
    } else personIcon(x, 76, 108, 30, css.fg);
    x.fillStyle = css.fg; x.font = 'bold 74px Manrope, sans-serif';
    x.fillText(big, 124, 138);
    var bw = x.measureText(big).width;
    x.fillStyle = '#15140F'; x.font = 'bold 30px Manrope, sans-serif';
    x.fillText(label, 124 + bw + 22, 110);
    x.font = 'bold 22px Manrope, sans-serif';
    var cw = x.measureText(chip).width + 30;
    x.fillStyle = '#FFFFFF'; x.roundRect(124 + bw + 22, 122, cw, 32, 16); x.fill();
    x.fillStyle = css.fg; x.fillText(chip, 124 + bw + 37, 145);

    var g = new THREE.Group();
    g.add(slab(5.2, PNH, 0.7, 0.26, css.solid));
    var f = new THREE.Mesh(new THREE.PlaneGeometry(5.2, PNH), face(cv));
    f.position.z = FZ(0.7); g.add(f);
    return g;
  }

  var pOk = makePanel(true, '1-Я ЛИНИЯ · БОТ', '82%', 'закрыл сам', 'ответ ~4 с',
    { bg: '#E6F2EA', fg: '#2A6B38', solid: 0xE6F2EA });
  pOk.position.set(-PX, PYB, 0.6); world.add(pOk);

  var pEsc = makePanel(false, '2-Я ЛИНИЯ · ЧЕЛОВЕК', '18%', 'закрыл сложное', 'с историей чата',
    { bg: '#F7EADA', fg: '#A8650F', solid: 0xF7EADA });
  pEsc.position.set(PX, PYB, 0.6); world.add(pEsc);

  /* ========== 4. Стрелки ========== */

  // Cut from the same bevelled slab stock as the cards: flat, straight, down
  function arrow(xc, yTop, yBot, hex, rot) {
    var L = yTop - yBot, sw = 0.09, hw = 0.24, hl = Math.min(0.26, L * 0.5);
    var sh = new THREE.Shape();
    sh.moveTo(-sw, 0); sh.lineTo(sw, 0); sh.lineTo(sw, -(L - hl));
    sh.lineTo(hw, -(L - hl)); sh.lineTo(0, -L); sh.lineTo(-hw, -(L - hl));
    sh.lineTo(-sw, -(L - hl)); sh.closePath();
    var g = new THREE.ExtrudeGeometry(sh, {
      depth: 0.1, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.02,
      bevelOffset: 0, bevelSegments: 2
    });
    g.translate(0, 0, -0.05);
    var m = new THREE.Mesh(g, flat(hex));
    m.position.set(xc, yTop, 0.6);
    if (rot) m.rotation.z = rot;
    m.castShadow = true; m.receiveShadow = true;
    world.add(m);
  }
  var QTOP = SY + SH / 2 + 0.38, QBOT = SY - SH / 2 - 0.33, PTOP = PYB + PNH / 2 + 0.1;
  var EX0 = -PX + 2.6 + 0.12, EX1 = PX - 2.6 - 0.12;
  CH.forEach(function (d) { arrow(d.x, d.y0 - d.h / 2 - 0.1, QTOP, GREEN); });
  // the queue feeds both lines…
  arrow(-PX, QBOT, PTOP, GREEN);
  arrow( PX, QBOT, PTOP, OCHRE);
  // …and the first line escalates sideways to the second
  arrow(EX0, PYB, PYB - (EX1 - EX0), OCHRE, Math.PI / 2);

  var etag = makeTag('эскалация', '#A8650F');
  etag.position.set(0, PYB + 0.48, 0.6); world.add(etag);

  /* ========== 5. Бот и человек ========== */

  var mixers = [];
  var loader = new THREE.GLTFLoader();

  // A skinned mesh keeps its geometry in bind space, so its bounding box can
  // collapse to a few millimetres. Measure the skeleton instead and pad for the
  // scalp the topmost joint does not reach.
  function measure(obj) {
    obj.updateMatrixWorld(true);
    var geo = new THREE.Box3().setFromObject(obj);
    var bone = new THREE.Box3(), v = new THREE.Vector3(), n = 0;
    obj.traverse(function (o) {
      if (o.isBone) { v.setFromMatrixPosition(o.matrixWorld); bone.expandByPoint(v); n++; }
    });
    if (n && (geo.max.y - geo.min.y) < (bone.max.y - bone.min.y) * 0.5) {
      bone.max.y += (bone.max.y - bone.min.y) * 0.09;
      return bone;
    }
    return geo;
  }

  function stage(obj, targetH, x, z, ry) {
    obj.rotation.y = ry;
    var box = measure(obj);
    var k = targetH / (box.max.y - box.min.y);
    obj.scale.setScalar(k);
    obj.position.set(x - (box.min.x + box.max.x) / 2 * k,
                     BASE - box.min.y * k,
                     z - (box.min.z + box.max.z) / 2 * k);
    obj.traverse(function (o) {
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    });
    world.add(obj);
  }

  // Both characters turn to the hall when they gesture, then back to their work
  var bot = null, hum = null;

  loader.load(DECK_MODELS.robot, function (g) {
    var m = g.scene;
    m.traverse(function (o) {
      if (o.isMesh && o.material && o.material.name === 'Main') {
        o.material = o.material.clone();
        o.material.color.setHex(GREEN).convertSRGBToLinear();
      }
    });
    stage(m, 2.9, -8.1, 2.4, 0.45);
    var mx = new THREE.AnimationMixer(m);
    var A = {};
    g.animations.forEach(function (c) { A[c.name] = mx.clipAction(c); });
    A.Idle.play();
    var cur = A.Idle;
    mx.addEventListener('finished', function () {
      A.Idle.reset().play(); cur.crossFadeTo(A.Idle, 0.35, false); cur = A.Idle;
      bot.face = 0;
    });
    mixers.push(mx);
    bot = {
      o: m, ry: 0.45, face: 0,
      play: function (name) {
        var a = A[name]; if (!a || cur !== A.Idle) return;
        a.reset(); a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; a.play();
        cur.crossFadeTo(a, 0.25, false); cur = a;
        bot.face = name === 'Wave' ? 1 : 0.5;
      }
    };
  });

  var AX = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
  var drive = [];

  loader.load(DECK_MODELS.human, function (g) {
    var m = g.scene;
    stage(m, 2.9, 7.7, 2.4, -0.45);

    var B = {};
    m.traverse(function (o) { if (o.isBone) B[o.name] = o; });
    var rq = new THREE.Quaternion(); m.getWorldQuaternion(rq);

    function aim(bone, child, d) {
      var b = B[bone], c = B[child];
      if (!b || !c) return;
      b.updateMatrixWorld(true); c.updateMatrixWorld(true);
      var cur = new THREE.Vector3().setFromMatrixPosition(c.matrixWorld)
        .sub(new THREE.Vector3().setFromMatrixPosition(b.matrixWorld)).normalize();
      var tgt = new THREE.Vector3(d[0], d[1], d[2]).normalize().applyQuaternion(rq);
      var dq = new THREE.Quaternion().setFromUnitVectors(cur, tgt);
      var pq = new THREE.Quaternion(); b.parent.getWorldQuaternion(pq);
      b.quaternion.premultiply(pq.clone().invert().multiply(dq).multiply(pq));
      b.updateMatrixWorld(true);
    }
    function snap(names) { var o = {}; names.forEach(function (n) { if (B[n]) o[n] = B[n].quaternion.clone(); }); return o; }
    var ARM = ['mixamorigRightArm', 'mixamorigRightForeArm'];

    aim('mixamorigLeftArm',      'mixamorigLeftForeArm',  [ 0.30, -1, 0.05]);
    aim('mixamorigRightArm',     'mixamorigRightForeArm', [-0.30, -1, 0.05]);
    aim('mixamorigLeftForeArm',  'mixamorigLeftHand',     [ 0.12, -1, 0.42]);
    aim('mixamorigRightForeArm', 'mixamorigRightHand',    [-0.12, -1, 0.42]);
    var rest = snap(ARM);
    // raised hand: upper arm out and up, forearm straight up
    aim('mixamorigRightArm',     'mixamorigRightForeArm', [-0.85, 0.35, 0.25]);
    aim('mixamorigRightForeArm', 'mixamorigRightHand',    [-0.15, 1, 0.15]);
    var wave = snap(ARM);
    ARM.forEach(function (n) { if (B[n]) B[n].quaternion.copy(rest[n]); });

    // amplitudes big enough to read from the back row of a hall
    [['mixamorigHips',         'z', 0.045, 0.0, 0.60],
     ['mixamorigSpine',        'x', 0.060, 0.0, 0.95],
     ['mixamorigSpine1',       'z', 0.050, 3.1, 0.60],
     ['mixamorigNeck',         'x', 0.080, 0.6, 0.80],
     ['mixamorigHead',         'y', 0.300, 2.0, 0.45],
     ['mixamorigLeftArm',      'z', 0.110, 0.4, 0.70],
     ['mixamorigRightArm',     'z', 0.110, 2.5, 0.70, 'rest'],
     ['mixamorigLeftForeArm',  'x', 0.220, 1.0, 0.90],
     ['mixamorigRightForeArm', 'x', 0.220, 3.0, 0.90, 'rest'],
     ['mixamorigRightForeArm', 'z', 0.450, 0.0, 9.00, 'wave']
    ].forEach(function (r) {
      var b = B[r[0]]; if (!b) return;
      var e = null;
      drive.forEach(function (q) { if (q.b === b) e = q; });
      if (!e) {
        e = { b: b, rest: b.quaternion.clone(), wave: wave[r[0]] || null, sw: [] };
        drive.push(e);
      }
      e.sw.push({ a: AX[r[1]], m: r[2], p: r[3], s: r[4], gate: r[5] || '' });
    });
    hum = { o: m, x: m.position.x, ry: -0.45, w: 0, until: 0, face: 0 };
  });

  function humWave(T, dur) { if (hum) { hum.until = T + dur; } }

  /* ========== 6. Живой поток ========== */

  var chips = [], pulses = [], pings = [];
  var Z = 1.08;   // in front of the card faces, so the hand-off stays visible

  function makeChip(d) {
    var c = document.createElement('canvas'); c.width = 160; c.height = 80;
    var x = c.getContext('2d');
    x.fillStyle = d.css; x.fillRect(0, 0, 160, 80);
    x.fillStyle = '#FFFFFF'; x.font = '800 38px Manrope, sans-serif';
    x.textAlign = 'center'; x.fillText(d.code, 80, 53);
    var g = new THREE.Group();
    g.add(slab(0.64, 0.32, 0.08, 0.14, parseInt(d.css.slice(1), 16)));
    var f = new THREE.Mesh(new THREE.PlaneGeometry(0.64, 0.32), face(c));
    f.position.z = FZ(0.08); g.add(f);
    shade(g);
    world.add(g);
    return g;
  }
  // one leg of a trip: from a to b along y, then sink into the target
  function travel(mesh, x0, y0, x1, y1, t0, dur, done, keep) {
    chips.push({ m: mesh, x0: x0, y0: y0, x1: x1, y1: y1, t0: t0, dur: dur, done: done, keep: keep });
  }

  var T = 0, busy = 0, timers = [], nSent = 0;
  // timers run on slide time, so a hidden tab does not pile up trips
  function later(sec, fn) { timers.push({ t: T + sec, fn: fn }); }
  function send(d) {
    var msg = d.msgs[(d.n = ((d.n || 0) + 1) % d.msgs.length)];
    var t = T;
    drawScreen(d.cv, d.id, msg, true); d.tex.needsUpdate = true;
    pings.push({ d: d, t0: t });

    var chip = makeChip(d);
    var yStart = d.y0 - d.h / 2 - 0.05;
    travel(chip, d.x, yStart, d.x, QTOP + 0.05, t + 0.35, 0.75, function () {
      world.remove(chip);
      var row = { ch: d.id, text: msg, st: 'new', sec: 2 + Math.floor(Math.random() * 6), t0: T, tf: -9 };
      QROWS.unshift(row); if (QROWS.length > 6) QROWS.pop();
      drawScreen(d.cv, d.id, msg, false); d.tex.needsUpdate = true;

      later(1.3, function () {
        // demo cadence: every third request is one the bot cannot close
        var esc = (nSent++ % 3) === 2;
        var out = makeChip(d);
        travel(out, -PX, QBOT + 0.1, -PX, PTOP + 0.05, T, 0.7, function () {
          if (!esc) {
            world.remove(out);
            row.st = 'ok'; row.tf = T;
            pulses.push({ m: pOk, t0: T });
            if (bot) bot.play(Math.random() < 0.5 ? 'ThumbsUp' : 'Yes');
            return;
          }
          // the bot shakes its head and hands the case over, history attached
          pulses.push({ m: pOk, t0: T });
          if (bot) bot.play('No');
          row.st = 'esc'; row.tf = T;
          later(0.5, function () {
            humWave(T, 2.4);
            travel(out, EX0 - 0.3, PYB, EX1 + 0.5, PYB, T, 1.0, function () {
              world.remove(out);
              pulses.push({ m: pEsc, t0: T });
              // the second line closes it too
              later(1.6, function () { row.st = 'hum'; row.tf = T; });
            }, true);
          });
        });
      });
    });
  }

  // Click a device (or press 1–5) to send a message from that channel —
  // the hall picks a channel, the slide answers
  var ray = new THREE.Raycaster(), mp = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown', function (e) {
    mp.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
    ray.setFromCamera(mp, camera);
    var hit = ray.intersectObjects(CH.map(function (d) { return d.dev; }), true)[0];
    if (!hit) return;
    var o = hit.object; while (o && !o.userData.ch) o = o.parent;
    if (o) { send(o.userData.ch); busy = T + 6; }
  });
  addEventListener('keydown', function (e) {
    var i = '12345'.indexOf(e.key);
    if (i >= 0) { send(CH[i]); busy = T + 6; }
  });

  // On its own the slide keeps a steady stream going, channel after channel
  var order = [1, 3, 0, 2, 4, 1, 0, 3, 2, 4], oi = 0, nextAuto = 1.2;
  later(0.9, function () {
    if (bot) bot.play('Wave');
    humWave(T, 2.6);
  });

  /* ========== Animate ========== */
  var clock = new THREE.Clock();
  var qt = new THREE.Quaternion(), qb = new THREE.Quaternion();
  function frame(dt) {
    T += dt;

    var due = timers.filter(function (t) { return t.t <= T; });
    timers = timers.filter(function (t) { return t.t > T; });
    due.forEach(function (t) { t.fn(); });

    if (T > nextAuto && T > busy) { send(CH[order[oi++ % order.length]]); nextAuto = T + 2.3; }

    mixers.forEach(function (m) { m.update(dt); });

    if (bot) {
      var by = bot.face ? 0.45 - 0.45 * bot.face : 0.45;
      bot.o.rotation.y += (by - bot.o.rotation.y) * Math.min(1, dt * 4);
    }
    if (hum) {
      var tw = T < hum.until ? 1 : 0;
      hum.w += (tw - hum.w) * Math.min(1, dt * 5);
      hum.o.rotation.y += ((tw ? -0.05 : -0.45) - hum.o.rotation.y) * Math.min(1, dt * 4);
      hum.o.position.x = hum.x + Math.sin(T * 0.6) * 0.04;
      drive.forEach(function (e) {
        qb.copy(e.rest);
        if (e.wave) qb.slerp(e.wave, hum.w);
        e.sw.forEach(function (w) {
          var g = w.gate === 'wave' ? hum.w : w.gate === 'rest' ? 1 - hum.w : 1;
          if (g > 0.001) qb.multiply(qt.setFromAxisAngle(w.a, Math.sin(T * w.s + w.p) * w.m * g));
        });
        e.b.quaternion.copy(qb);
      });
    }

    pings.forEach(function (p) {
      var k = (T - p.t0) / 0.5;
      p.d.dev.position.y = p.d.y0 + (k < 1 ? Math.sin(Math.PI * k) * 0.22 : 0);
      var bk = T - p.t0;
      p.d.badge.scale.setScalar(bk < 1.4 ? Math.max(0.001, Math.min(1, bk * 6) * (1 + 0.25 * Math.sin(bk * 14))) : 0.001);
    });
    pings = pings.filter(function (p) { return T - p.t0 < 1.5; });

    chips = chips.filter(function (c) {
      var k = (T - c.t0) / c.dur;
      if (k < 0) { c.m.visible = false; return true; }
      c.m.visible = true;
      var e = ease(k);
      c.m.position.set(c.x0 + (c.x1 - c.x0) * e, c.y0 + (c.y1 - c.y0) * e, Z);
      c.m.scale.setScalar(k > 0.8 && !c.keep ? Math.max(0.05, 1 - (k - 0.8) * 4) : 1);
      if (k >= 1) { c.done(); return false; }
      return true;
    });

    pulses = pulses.filter(function (p) {
      var k = (T - p.t0) / 0.45;
      p.m.scale.setScalar(1 + (k < 1 ? Math.sin(Math.PI * k) * 0.06 : 0));
      return k < 1;
    });

    drawQueue(T);
    renderer.render(scene, camera);
  }
  (function tick() {
    requestAnimationFrame(tick);
    frame(Math.min(clock.getDelta(), 0.1));
  })();

  addEventListener('resize', function () {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  });
});
  });
</script>

</body></html>
